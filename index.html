function calcQ(){
  let mat=0
  catalogItems.forEach(i=>{mat+=(i.price||0)*(qQtys[i.id]||0)})
  const toolRate=parseFloat(document.getElementById('qs-tool-rate')?.value||0)
  const mgRate=parseFloat(document.getElementById('qs-margin-rate')?.value||0)
  const tool=Math.round(mat*toolRate/100),mg=Math.round(mat*mgRate/100)
  const supply=mat+tool+mg,vat=Math.round(supply*.1),grand=supply+vat
  document.getElementById('qs-mat').textContent=mat.toLocaleString()+'원'
  document.getElementById('qs-tool').textContent=tool.toLocaleString()+'원'
  document.getElementById('qs-margin').textContent=mg.toLocaleString()+'원'
  document.getElementById('qs-supply').textContent=supply.toLocaleString()+'원'
  document.getElementById('qs-vat').textContent=vat.toLocaleString()+'원'
  document.getElementById('qs-grand').textContent=grand.toLocaleString()+'원'
}

async function saveQFromCatalog(){
  const allItems=[];let mat=0
  catalogItems.forEach(i=>{const qty=qQtys[i.id]||0;if(qty>0){const total=(i.price||0)*qty;allItems.push({cat:i.cat,name:i.name,spec:i.spec||'',unit:i.unit||'',qty,price:i.price||0,total});mat+=total}})
  if(!allItems.length){toast('수량을 입력한 품목이 없어요',true);return}
  const toolRate=parseFloat(document.getElementById('qs-tool-rate').value||0)
  const mgRate=parseFloat(document.getElementById('qs-margin-rate').value||0)
  const tool=Math.round(mat*toolRate/100),mg=Math.round(mat*mgRate/100)
  const supply=mat+tool+mg,vat=Math.round(supply*.1),grand=supply+vat
  const payload={
    ...getQSite(),
    client:document.getElementById('qo-client').value.trim(),
    notes:document.getElementById('qo-notes').value.trim()||null,
    items:allItems,mat,tool_rate:toolRate,tool_cost:tool,
    margin_rate:mgRate,margin_cost:mg,supply,vat,grand,
    total:grand
  }
  let error
  if(_qEditId){
    ({error}=await db.from('quotes').update(payload).eq('id',_qEditId))
  } else {
    payload.status='작성중'
    payload.created_by_id=me.id
    payload.created_by_name=me.name
    ;({error}=await db.from('quotes').insert(payload))
  }
  if(error){toast('저장 실패: '+error.message,true);return}
  toast(_qEditId?'견적서 수정됐어요':'견적서 저장됐어요');closeQOverlay();rQuotes()
}

async function editQ(id){
  const q=quotes.find(x=>x.id===id);if(!q)return
  const[{data},]=await Promise.all([
    db.from('catalog_items').select('*').order('sort_order').order('created_at'),
    ensureSites()
  ])
  catalogItems=data||[]
  _qEditId=id;qCatTab=CATS[0];qQtys={}
  // 저장된 품목을 카탈로그 ID로 매핑
  const savedItems=q.items||[]
  savedItems.forEach(saved=>{
    const match=catalogItems.find(c=>c.name===saved.name&&c.cat===saved.cat)
    if(match)qQtys[match.id]=saved.qty
  })
  // 기존 견적은 site_id가 없으므로 현장명으로 찾아 연결해준다 (저장 시 반영됨)
  let sid=q.site_id&&sites.some(s=>s.id===q.site_id)?q.site_id:null
  if(!sid&&q.site_name){
    const qn=cmpNorm(q.site_name)
    const hit=sites.find(s=>{const sn=cmpNorm(s.name);return sn&&qn&&(sn===qn||sn.includes(qn)||qn.includes(sn))})
    if(hit)sid=hit.id
  }
  renderQSiteOptions(sid,sid?'':(q.site_name||''))
  document.getElementById('qo-client').value=q.client||''
  document.getElementById('qo-notes').value=q.notes||''
  document.getElementById('qs-tool-rate').value=q.tool_rate??3
  document.getElementById('qs-margin-rate').value=q.margin_rate??8
  document.getElementById('qo-tabs').innerHTML=CATS.map(c=>`<button class="qo-tab${c===qCatTab?' on':''}" onclick="setQCat('${c}')">${c}</button>`).join('')
  renderQBody();calcQ()
  foldQInfo(true)   // 수정은 현장이 이미 정해져 있으니 접은 채로 연다
  document.querySelector('#qoverlay h2').textContent='견적서 수정'
  document.getElementById('qoverlay').classList.add('on')
  closeSheet()
}

function fileIcon(name){
  const ext=(name.split('.').pop()||'').toLowerCase()
  if(['pdf'].includes(ext))return '📄'
  if(['doc','docx'].includes(ext))return '📝'
  if(['xls','xlsx'].includes(ext))return '📊'
  if(['ppt','pptx'].includes(ext))return '📑'
  if(['html','htm'].includes(ext))return '🌐'
  if(['txt'].includes(ext))return '📃'
  if(['zip','rar','7z'].includes(ext))return '🗜️'
  return '📎'
}

function extractYtId(url){
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/)
  return m?m[1]:null
}

function eduImgUpload(input){
  const files=Array.from(input.files)
  files.forEach(f=>{
    if(f.size>5*1024*1024){toast('사진은 5MB 이하만 가능해요',true);return}
    const r=new FileReader()
    r.onload=e=>{window._eduImages.push(e.target.result);renderEduImages()}
    r.readAsDataURL(f)
  })
  input.value=''
}

function eduVideoUpload(input){
  const f=input.files[0];if(!f)return
  if(f.size>50*1024*1024){toast('동영상은 50MB 이하만 가능해요',true);return}
  const r=new FileReader()
  r.onload=e=>{
    window._eduVideo=e.target.result;window._eduVideoName=f.name
    document.getElementById('edu-video-label').textContent=`✅ ${f.name}`
    toast('동영상 첨부됐어요')
  }
  r.readAsDataURL(f)
  input.value=''
}

function eduFileUpload(input){
  const files=Array.from(input.files)
  files.forEach(f=>{
    if(f.size>10*1024*1024){toast(`${f.name}: 10MB 이하 파일만 가능해요`,true);return}
    const r=new FileReader()
    r.onload=e=>{
      window._eduFiles.push({name:f.name,data:e.target.result,type:f.type})
      renderEduFiles()
      toast(`${f.name} 첨부됐어요`)
    }
    r.readAsDataURL(f)
  })
  input.value=''
}

    ?`(d)=>{attY=d.y;attMo=d.mo;renderMyAttendance()}`
    :`(d)=>{attY=d.y;attMo=d.mo;openAdminAtt('${memberId||adminAttMemberId}','${adminAttMemberName}')}`

  return `<div class="att-wrap">
    <div class="att-month-nav">
      <button class="bs" style="padding:6px 10px" onclick="(${navFn})({y:${mo===0?y-1:y},mo:${mo===0?11:mo-1}})">◀</button>

    <div class="att-summary">
      <div class="att-sum"><div class="att-sum-n">${worked}</div><div class="att-sum-l">출근일</div></div>
      <div class="att-sum"><div class="att-sum-n">${ot}</div><div class="att-sum-l">야근</div></div>
      <div class="att-sum"><div class="att-sum-n">${dim-worked}</div><div class="att-sum-l">미출근</div></div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:10px;font-size:11px;color:var(--text2)">
      <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:2px;background:var(--navy)"></div>출근</div>
      <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:2px;background:var(--blue)"></div>출근+야근</div>
    </div>
    <div class="att-grid">
      ${days.map(d=>`<div class="att-dh">${d}</div>`).join('')}
      ${Array(firstDay).fill('<div class="att-day blank"></div>').join('')}
      ${Array.from({length:dim},(_,i)=>{
        const day=i+1,dateStr=`${y}-${pad(mo+1)}-${pad(day)}`
        const rec=att.find(a=>a.work_date===dateStr)
        const isFuture=dateStr>td,isToday=dateStr===td
        const cls=[isFuture?'future':rec?.overtime?'overtime':rec?'worked':'',isToday?'istoday':''].join(' ').trim()
        const clickFn=editable&&!isFuture?`onclick="toggleAtt('${dateStr}')"`:`onclick=""`
        return `<div class="att-day ${cls}" ${clickFn}><span>${day}</span>${rec?.overtime?'<span class="att-ot-dot">야근</span>':''}</div>`
      }).join('')}
    </div>
  </div>`
}

async function toggleAtt(date){
  const{data,error}=await db.from('attendance').select('*').eq('member_id',me.id).eq('work_date',date)
  const rec=data?.[0]
  if(!rec){
    await db.from('attendance').insert({member_id:me.id,work_date:date,overtime:false})
    toast('✅ 출근 체크')
  }else if(!rec.overtime){
    await db.from('attendance').update({overtime:true}).eq('id',rec.id)
    toast('🌙 야근 체크')
  }else{
    await db.from('attendance').delete().eq('id',rec.id)
    toast('출근 취소')
  }
  await renderMyAttendance()
}

// 팀원 CRUD
function showMemberForm(m=null){
  editId=m?.id||null
  openSheet(`<div class="st">${m?'팀원 수정':'팀원 추가'}</div>
    <div class="fg"><label class="fl">이름 *</label><input class="fi" id="f-mn" placeholder="예) 김철수" value="${m?.name||''}"></div>
    <div class="fg"><label class="fl">직급</label><select class="fi" id="f-mr">${['대표','팀장','대리','주임'].map(r=>`<option ${(m?.role||'주임')===r?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">연락처</label><input class="fi" id="f-mp" type="tel" placeholder="010-0000-0000" value="${m?.phone||''}"></div>
    <div class="fg">
      <label class="fl">${m?'비밀번호 변경 (비워두면 유지)':'초기 비밀번호 설정'}</label>
      <input class="fi" type="password" id="f-mpw" placeholder="${m?'새 비밀번호 (선택)':'비밀번호 입력'}">
    </div>
    ${m&&m.password!==undefined?`<div style="background:var(--amber-weak);border-radius:10px;padding:11px 14px;font-size:13px;color:#C77700;margin-bottom:14px">🔑 현재 비밀번호: ${m.password?'설정됨':'미설정'}</div>`:''}
    <button class="btn bp" onclick="saveMem()">${m?'저장':'추가'}</button>
    ${m?`
      <button class="btn" style="background:#F1F5F9;color:var(--red);margin-top:8px" onclick="resetMemberPw('${m.id}','${m.name}')">🔑 비밀번호 초기화</button>
      <button class="btn bg-r" onclick="delMem('${m.id}')">팀원 삭제</button>`:''}
  `)
}
async function resetMemberPw(id,name){
  if(!confirm(`${name}님의 비밀번호를 초기화할까요?\n다음 로그인 시 새 비밀번호를 설정하게 됩니다.`))return
  await db.from('members').update({password:''}).eq('id',id)
  toast(`${name}님 비밀번호 초기화 완료`)
  closeSheet()
}
async function editMem(id){
  const{data}=await db.from('members').select('*').eq('id',id).single()
  if(data) showMemberForm(data)
}
async function saveMem(){
  const name=document.getElementById('f-mn').value.trim()
  if(!name){toast('이름을 입력하세요',true);return}
  const pw=document.getElementById('f-mpw')?.value||''
  const data={name,role:v('f-mr'),phone:v('f-mp')}
  if(pw) data.password=pw
  if(!editId) data.password=pw||''
  if(editId){await db.from('members').update(data).eq('id',editId);toast('수정됐어요')}
  else{await db.from('members').insert(data);toast('추가됐어요')}
  closeSheet();rTeam()
}
async function delMem(id){
  if(!confirm('이 팀원을 삭제할까요?'))return
  await db.from('members').delete().eq('id',id);toast('삭제했어요');closeSheet();rTeam()
}
</script>
