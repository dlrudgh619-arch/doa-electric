<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도아전기">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F4F6">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>도아전기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* ── 토스형 디자인 토큰 ──
   기존 변수명(--navy/--blue/…)은 본문 인라인 스타일이 그대로 쓰고 있어 이름은 유지하고 값만 교체한다.
   --navy = 진한 본문 텍스트, --primary = 주요 액션(파랑) 으로 역할이 갈린다. */
:root{
  --primary:#3182F6;--primary-press:#1B64DA;--primary-weak:#E8F3FF;
  --navy:#191F28;--blue:#3182F6;
  --bg:#F2F4F6;--white:#fff;--surface:#fff;--border:#E5E8EB;
  --text:#191F28;--text-mid:#4E5968;--text2:#8B95A1;
  --red:#F04452;--red-weak:#FFEBEE;
  --green:#15C47E;--green-weak:#E5F8EF;
  --amber:#FF9500;--amber-weak:#FFF4E0;
  --r-card:18px;--r-md:14px;--r-sm:10px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100vh;
  letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
#login{display:flex;flex-direction:column;align-items:center;padding:72px 24px 40px;min-height:100vh;background:#fff}
.login-logo{font-size:52px;margin-bottom:20px}
.login-title{font-size:26px;font-weight:700;color:var(--text);margin-bottom:8px;letter-spacing:-.03em}
.login-sub{font-size:15px;color:var(--text2);margin-bottom:40px}
.login-card{background:var(--bg);border:none;border-radius:var(--r-card);width:100%;padding:8px 18px;margin-bottom:12px}
.login-lbl{font-size:13px;font-weight:600;color:var(--text2);margin:14px 0 4px;text-transform:none;letter-spacing:-.02em}
.login-member{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:16px;font-weight:600}
.login-member:last-child{border-bottom:none}
.login-member:active{opacity:.55}
.login-av{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.admin-btn{width:100%;padding:16px;border-radius:var(--r-md);background:var(--primary);border:none;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.02em}
.admin-btn:active{background:var(--primary-press)}
#hdr{background:var(--bg);color:var(--text);padding:14px 20px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
#hdr h1{font-size:22px;font-weight:700;letter-spacing:-.03em}
#hdr p{font-size:13px;color:var(--text2);margin-top:2px}
#hdr-right{display:flex;align-items:center;gap:10px}
#hdr-av{width:38px;height:38px;border-radius:13px;background:var(--primary-weak);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
#logout-btn{font-size:13px;color:var(--text2);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:500}
#main{padding:6px 20px 100px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(6,1fr);padding:8px 0 14px;z-index:100}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 0;border:none;background:none;color:var(--text2);font-size:10px;font-weight:500;font-family:inherit;letter-spacing:-.02em}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--primary);font-weight:700}
.card{background:var(--surface);border:none;border-radius:var(--r-card);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:none;border-radius:var(--r-card);padding:16px 18px;box-shadow:var(--shadow)}
.stat-n{font-size:28px;font-weight:700;color:var(--text);letter-spacing:-.04em}
.stat-l{font-size:13px;color:var(--text2);margin-top:2px}
.badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:-.02em}
.bi{background:var(--green-weak);color:#0E8F5B}.bd{background:#EEF1F4;color:#6B7684}.bw{background:var(--amber-weak);color:#C77700}.bh{background:#EEF1F4;color:#6B7684}
.br{background:var(--red-weak);color:var(--red)}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec-t{font-size:18px;font-weight:700;color:var(--text);text-transform:none;letter-spacing:-.03em}
.sec-a{font-size:14px;color:var(--text2);font-weight:500;cursor:pointer;background:none;border:none;font-family:inherit;letter-spacing:-.02em}
.fab{position:fixed;bottom:88px;right:50%;transform:translateX(190px);width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:28px;display:none;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(49,130,246,.4);z-index:99;line-height:1}
.fab:active{background:var(--primary-press)}

/* ── 토스형 홈 대시보드 ── */
.hero{padding:6px 0 18px}
.hero-eyebrow{font-size:14px;color:var(--text2);font-weight:500;margin-bottom:6px}
.hero-title{font-size:26px;font-weight:700;line-height:1.34;letter-spacing:-.035em;color:var(--text)}
.dash{background:var(--surface);border-radius:var(--r-card);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.dash-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dash-label{font-size:15px;font-weight:700;color:var(--text)}
.dash-date{font-size:13px;color:var(--text2)}
.dash-value{font-size:24px;font-weight:700;line-height:1.34;letter-spacing:-.035em;color:var(--text);display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.dash-foot{font-size:13px;color:var(--text2);margin-top:14px;padding-top:13px;border-top:1px solid var(--border)}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick{background:none;border:none;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0}
.quick:active{opacity:.55}
.quick-ico{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.quick-lbl{font-size:12px;color:var(--text-mid);font-weight:500;letter-spacing:-.03em}
.rows{background:var(--surface);border-radius:var(--r-card);padding:4px 18px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:none}
.row:active{opacity:.6}
.row-ico{width:44px;height:44px;border-radius:14px;background:var(--bg);color:var(--text-mid);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.row-copy{flex:1;min-width:0}
.row-title{font-size:16px;font-weight:700;letter-spacing:-.03em;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:13px;color:var(--text2);margin-top:3px}
.row-chev{color:#C4CBD3;font-size:17px;flex-shrink:0}
.tip{background:var(--primary-weak);border-radius:var(--r-card);padding:16px 18px;margin-top:12px}
.tip-t{font-size:15px;font-weight:700;color:var(--primary-press);margin-bottom:4px}
.tip-s{font-size:13px;color:#4B7ABF}
#sbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200}
#sbg.on{display:block}
#sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;background:var(--white);border-radius:24px 24px 0 0;padding:14px 20px 32px;z-index:201;transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto}
#sheet.on{transform:translateX(-50%) translateY(0)}
.sh{width:40px;height:4px;background:#E1E4E8;border-radius:2px;margin:0 auto 18px}
.st{font-size:20px;font-weight:700;margin-bottom:20px;color:var(--text);letter-spacing:-.03em}
.fg{margin-bottom:14px}
.fl{font-size:13px;font-weight:600;color:var(--text-mid);margin-bottom:7px;display:block}
.fi{width:100%;padding:15px 16px;border:none;border-radius:var(--r-md);font-size:16px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;appearance:none;-webkit-appearance:none;letter-spacing:-.02em;transition:box-shadow .15s}
.fi:focus{box-shadow:inset 0 0 0 2px var(--primary);background:#fff}
/* appearance:none 이라 select 은 화살표를 직접 그려줘야 드롭다운인 걸 안다 */
select.fi{padding-right:42px;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%238B95A1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 8l5 5 5-5'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:16px;border-radius:var(--r-md);border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.02em}
.bp{background:var(--primary);color:#fff}.bp:active{background:var(--primary-press)}
.bg-r{background:transparent;color:var(--red);margin-top:8px}
.bs{padding:9px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--bg);color:var(--text-mid);font-family:inherit;letter-spacing:-.02em}
.bs:active{background:#E5E8EB}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(25,31,40,.94);color:#fff;padding:13px 22px;border-radius:14px;font-size:14px;font-weight:600;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.li{background:var(--white);border:none;border-radius:var(--r-card);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.lt{font-size:17px;font-weight:700;color:var(--text);margin-bottom:4px;letter-spacing:-.03em}
.ls{font-size:13px;color:var(--text2)}
.lm{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.la{display:flex;gap:6px;margin-top:14px;border-top:1px solid var(--border);padding-top:14px;flex-wrap:wrap}
.av{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.empty{text-align:center;padding:64px 20px;color:var(--text2)}
.ei{font-size:44px;margin-bottom:12px;opacity:.3}
.fc{display:flex;gap:8px;margin:4px 0 16px;overflow-x:auto;padding-bottom:2px}
.fc::-webkit-scrollbar{display:none}
.fcc{flex-shrink:0;padding:8px 15px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:var(--white);color:var(--text2);letter-spacing:-.02em}
.fcc.on{background:var(--text);color:#fff}
.loading{display:flex;align-items:center;justify-content:center;padding:56px;gap:10px;color:var(--text2);font-size:14px}
.spin{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.qt{width:100%;border-collapse:collapse;font-size:13px}
.qt th{background:var(--bg);color:var(--text-mid);padding:11px 12px;text-align:left;font-weight:700}
.qt td{padding:11px 12px;border-bottom:1px solid var(--border)}
.qt tr:nth-child(even) td{background:#FAFBFC}
/* 사진 그리드 */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.photo-thumb{aspect-ratio:1;border-radius:12px;object-fit:cover;width:100%;cursor:pointer}
.photo-add{aspect-ratio:1;border-radius:12px;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--bg);color:var(--text2);gap:4px;font-size:24px}
.photo-add span{font-size:12px}
/* 근태 캘린더 */
.att-wrap{background:var(--white);border-radius:var(--r-card);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.att-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.att-month-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.03em}
.att-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.att-dh{text-align:center;font-size:11px;font-weight:600;color:var(--text2);padding-bottom:6px}
.att-day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:500;cursor:pointer;border:none;background:var(--bg);position:relative;user-select:none}
.att-day.worked{background:var(--primary);color:#fff;font-weight:700}
.att-day.overtime{background:var(--primary-press);color:#fff;font-weight:700}
.att-day.future{opacity:.35;cursor:default}
.att-day.blank{background:transparent;cursor:default}
.att-day.istoday{box-shadow:inset 0 0 0 2px var(--primary)}
.att-ot-dot{font-size:8px;position:absolute;bottom:3px;letter-spacing:-.5px;font-weight:700}
.att-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.att-sum{background:var(--bg);border-radius:var(--r-md);padding:14px 10px;text-align:center}
.att-sum-n{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.04em}
.att-sum-l{font-size:12px;color:var(--text2);margin-top:2px}
.att-legend{display:flex;gap:14px;margin-bottom:12px;font-size:12px;color:var(--text2)}
.att-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
/* 관리자 근태 바 */
.mem-att-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer}
.mem-att-row:last-child{border-bottom:none}
.att-bar-wrap{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.att-bar-fill{height:100%;background:var(--primary);border-radius:3px}
/* ── 전체화면 오버레이 공통 ── */
.full-ov{display:none;position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);background:var(--bg);z-index:250;flex-direction:column;overflow:hidden}
.full-ov.on{display:flex}
.qo-hdr{background:#fff;color:var(--text);padding:14px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;border-bottom:1px solid var(--border)}
.qo-hdr h2{font-size:18px;font-weight:700;flex:1;letter-spacing:-.03em}
.qo-back{background:none;border:none;color:var(--text);font-size:26px;cursor:pointer;line-height:1;padding:0 4px;font-family:inherit}
.qo-info{background:#fff;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
/* 견적 작성은 자재 목록이 주인공이다. 현장 정보·합계 상세는 접어서 목록에 높이를 몰아준다 */
.qo-info.fold,.qo-detail.fold{display:none}
.qo-bar{display:flex;align-items:center;gap:8px;background:#fff;padding:11px 16px;border-bottom:1px solid var(--border);
  flex-shrink:0;cursor:pointer;font-size:14px;color:var(--text2);letter-spacing:-.02em}
.qo-bar b{color:var(--text);font-weight:700}
.qo-bar .car{margin-left:auto;color:var(--text2);font-size:12px;flex-shrink:0}
.qo-bar:active{background:var(--bg)}
.qo-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qo-tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.qo-tabs::-webkit-scrollbar{display:none}
.qo-tab{flex-shrink:0;padding:8px 14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:var(--bg);color:var(--text2);font-family:inherit;letter-spacing:-.02em}
.qo-tab.on{background:var(--text);color:#fff}
.qo-body{flex:1;overflow-y:auto;padding:14px 16px}
/* 견적 작성 – 카탈로그 품목 행 */
.qc-item{background:#fff;border:none;border-radius:var(--r-md);padding:11px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.qc-item.active{box-shadow:inset 0 0 0 2px var(--primary);background:var(--primary-weak)}
.qc-meta{flex:1;min-width:0}
.qc-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.03em}
.qc-sub{font-size:12px;color:var(--text2);margin-top:2px}
.qc-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.qc-price{font-size:12px;color:var(--text2)}
.qc-qty-wrap{display:flex;align-items:center;gap:6px}
.qc-qty-wrap button{width:30px;height:30px;border-radius:9px;border:none;background:var(--bg);font-size:16px;cursor:pointer;line-height:1;color:var(--text-mid);font-family:inherit}
.qc-qty-wrap input{width:46px;height:30px;border:none;background:var(--bg);border-radius:9px;font-size:14px;text-align:center;font-family:inherit;color:var(--text);outline:none;font-weight:600}
.qc-subtotal{font-size:13px;font-weight:700;color:var(--primary)}
/* 하단 합계 */
.qo-foot{flex-shrink:0;background:#fff;border-top:1px solid var(--border);padding:14px 16px 20px}
.qo-sum-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:14px}
.qo-sum-label{color:var(--text2)}
.qo-sum-rate{display:flex;align-items:center;gap:5px}
.qo-rate-inp{width:44px;padding:5px 4px;border:none;background:var(--bg);border-radius:8px;font-size:13px;text-align:center;font-family:inherit;color:var(--text);font-weight:700;outline:none}
.qo-sum-val{font-weight:600;color:var(--text)}
.qo-divider{border:none;border-top:1px solid var(--border);margin:8px 0}
.qo-grand{display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px}
.qo-grand-label{font-size:16px;font-weight:700;color:var(--text)}
.qo-grand-val{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.04em}
/* 카탈로그 관리 품목 행 */
.cm-item{background:#fff;border:none;border-radius:var(--r-md);padding:15px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.cm-meta{flex:1;min-width:0}
.cm-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.03em}
.cm-sub{font-size:12px;color:var(--text2);margin-top:2px}
.cm-price{font-size:15px;font-weight:700;color:var(--text);text-align:right;flex-shrink:0}
.cm-edit{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:0 2px;line-height:1}
.cm-edit:active{color:var(--primary)}
.cm-del{background:none;border:none;color:#C4CBD3;font-size:20px;cursor:pointer;padding:0 2px;line-height:1}
.cm-del:active{color:var(--red)}
/* 달력 — 남은 화면 높이를 꽉 채운다 */
.cal-wrap{display:flex;flex-direction:column;background:var(--white);border:none;box-shadow:var(--shadow);
  border-radius:var(--r-card);overflow:hidden;margin-bottom:14px;height:calc(100dvh - 232px);min-height:380px}
.cal-head{flex-shrink:0;display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg)}
.cal-body{flex:1;display:flex;flex-direction:column;min-height:0}
.cal-week{position:relative;flex:1 1 0;border-bottom:.5px solid var(--border)}
.cal-week:last-child{border-bottom:none}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);height:100%}

/* ══════════════ PC 레이아웃 (1024px 이상에서만 적용) ══════════════
   screen 한정이라 인쇄/PDF와 모바일 화면에는 영향이 없다 */
@media screen and (min-width:1024px){
  body{max-width:none}
  body.logged-in{overflow:hidden}

  /* 로그인 화면은 가운데 카드로 */
  #login{justify-content:center}
  .login-card,.admin-btn{max-width:420px}

  /* 앱 셸: 상단 헤더 + 좌측 사이드바 + 본문 (DOM 순서와 무관하게 배치) */
  body.logged-in{background:var(--bg)}
  body.logged-in #app{display:grid!important;grid-template-columns:248px minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);height:100vh;overflow:hidden}
  #hdr{grid-area:1/1/2/3;position:static;padding:20px 36px 16px;background:#fff;border-bottom:1px solid var(--border)}
  #hdr h1{font-size:24px}
  #hdr p{font-size:14px}

  /* 하단 탭바 → 좌측 세로 메뉴 */
  #nav{grid-area:2/1/3/2;position:static;width:auto;max-width:none;transform:none;background:#fff;
    backdrop-filter:none;display:flex;flex-direction:column;gap:4px;padding:20px 14px;
    border-top:none;border-right:1px solid var(--border);overflow-y:auto}
  .nb{flex-direction:row;justify-content:flex-start;gap:14px;padding:13px 16px;
    border-radius:var(--r-md);font-size:15px;font-weight:600}
  .nb svg{width:21px;height:21px}
  .nb:hover{background:var(--bg)}
  .nb.on{background:var(--primary-weak);color:var(--primary);font-weight:700}

  /* 본문: 목록 카드는 2단, 그 외 요소는 전체 폭 */
  #main{grid-area:2/2/3/3;overflow-y:auto;padding:28px 36px 90px;
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start}
  #main>*{grid-column:1/-1;margin-bottom:0}
  #main>.li{grid-column:auto}
  .li{transition:box-shadow .15s,transform .15s}
  .li:hover{box-shadow:0 4px 20px rgba(0,0,0,.09);transform:translateY(-1px)}
  .stats{grid-template-columns:repeat(4,1fr)}
  .att-wrap{max-width:820px}
  .photo-grid{grid-template-columns:repeat(6,1fr)}
  .bs:hover{background:#E5E8EB}

  /* 홈 대시보드: 히어로/카드는 전체 폭, 지금 진행 중 목록은 넉넉하게 */
  .hero{padding:2px 0 20px}
  .hero-title{font-size:32px}
  .dash-value{font-size:28px}
  .quick-grid{grid-template-columns:repeat(8,1fr)}
  .quick-ico{width:52px;height:52px;font-size:21px}
  .quick-lbl{font-size:13px}
  .rows{padding:6px 22px}
  .row-title{font-size:17px}
  .home-2col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}

  .fab{right:40px;bottom:36px;transform:none;width:60px;height:60px;font-size:30px}

  /* 달력: PC는 헤더/여백이 달라 높이를 다시 잡는다 */
  .cal-wrap{height:calc(100vh - 262px);min-height:420px}

  /* 바텀시트 → 가운데 모달 */
  #sheet{top:50%;bottom:auto;width:min(92vw,620px);max-width:620px;max-height:86vh;
    border-radius:24px;padding:28px 28px 32px;opacity:0;pointer-events:none;
    transform:translate(-50%,-48%);transition:opacity .18s,transform .18s}
  #sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sh{display:none}

  /* 전체화면 오버레이(견적/카탈로그/교육) → 가운데 패널 */
  .full-ov{top:32px;bottom:32px;width:min(94vw,1000px);border-radius:24px;
    box-shadow:0 24px 60px rgba(0,0,0,.24)}
  .qo-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
    align-content:start;padding:18px 20px}
  .qo-body>*{margin-bottom:0}
  .qo-body>.empty{grid-column:1/-1}
  #cat-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
  #cat-body>*{margin-bottom:0}
  #cat-body>*:not(.cm-item){grid-column:1/-1}
}
@media screen and (min-width:1600px){
  #main{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* PDF 인쇄 */
@media print{body>*{display:none!important}#printarea{display:block!important;position:fixed;inset:0;background:#fff;z-index:9999}}
#printarea{display:none}
</style>
</head>

<div id="qoverlay" class="full-ov">
  <div class="qo-hdr">
    <button class="qo-back" onclick="closeQOverlay()">‹</button>
    <h2>견적서 작성</h2>
  </div>
  <div class="qo-bar" onclick="toggleQInfo()"><span id="qo-bar-txt">현장 <b>미선택</b></span><span class="car" id="qo-bar-car">접기 ▲</span></div>
  <div class="qo-info" id="qo-info">
    <div><label class="fl">현장 선택</label><select class="fi" id="qo-site-sel" onchange="onQSiteChange()"></select></div>
    <div id="qo-site-manual" style="margin-top:8px;display:none"><label class="fl">현장명 직접 입력</label><input class="fi" id="qo-site-name" placeholder="현장명을 입력하세요"></div>
    <div style="margin-top:8px"><label class="fl">발주처</label><input class="fi" id="qo-client" placeholder="발주처명" oninput="qBarText()"></div>
    <div style="margin-top:8px"><label class="fl">견적참고사항</label><textarea class="fi" id="qo-notes" rows="2" placeholder="특이사항, 조건 등 참고사항을 입력하세요..." style="resize:none;line-height:1.6;font-size:13px;color:#c0392b;font-weight:500"></textarea></div>
  </div>

        <span class="qo-sum-label">공구손료</span>
        <span class="qo-sum-rate"><input class="qo-rate-inp" id="qs-tool-rate" type="number" value="3" min="0" max="100" oninput="calcQ()">%</span>
        <span class="qo-sum-val" id="qs-tool">0원</span>
      </div>

        <span class="qo-sum-label">업체마진</span>
        <span class="qo-sum-rate"><input class="qo-rate-inp" id="qs-margin-rate" type="number" value="8" min="0" max="100" oninput="calcQ()">%</span>
        <span class="qo-sum-val" id="qs-margin">0원</span>
      </div>
      <hr class="qo-divider">
      <div class="qo-sum-row"><span class="qo-sum-label">공급가액</span><span class="qo-sum-val" id="qs-supply">0원</span></div>
      <div class="qo-sum-row"><span class="qo-sum-label">부가세 (10%)</span><span class="qo-sum-val" id="qs-vat">0원</span></div>

      <span class="qo-grand-val" id="qs-grand">0원</span>

// ── 알림 권한 + Realtime + Web Push
async function requestNotifPermission(){
  if('Notification' in window && Notification.permission==='default'){
    await Notification.requestPermission()
  }
  if('Notification' in window && Notification.permission==='granted'){
    subscribeForPush()
  }
}
function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4)
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/')
  const raw=atob(base64)
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))
}
function bufToB64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
async function subscribeForPush(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window))return
    const reg=await navigator.serviceWorker.ready
    let sub=await reg.pushManager.getSubscription()
    if(!sub){
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)})
    }
    await db.from('push_subscriptions').upsert({
      member_id:me.id,member_name:me.name,
      endpoint:sub.endpoint,
      p256dh:bufToB64(sub.getKey('p256dh')),
      auth:bufToB64(sub.getKey('auth'))
    },{onConflict:'endpoint'})
  }catch(e){console.warn('[Push] 구독 실패',e)}
}
function pushNotif(title,body){
  toast(title+' '+body)
  if('Notification' in window && Notification.permission==='granted'){

// Realtime 은 행 단위로 오므로, 짧은 시간에 몰린 건은 하나로 묶어 한 번만 알린다
const _nBuf={}
function notifBatch(key,title,bodyFn,delay=2500){
  const b=_nBuf[key]||(_nBuf[key]={n:0})
  b.n++
  clearTimeout(b.t)
  b.t=setTimeout(()=>{const n=b.n;delete _nBuf[key];pushNotif(title,bodyFn(n))},delay)
}

function setupRealtime(){
  if(window._realtimeCh)db.removeChannel(window._realtimeCh)
  window._realtimeCh=db.channel('doa-updates')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'site_memos'},p=>{
      if(p.new.member_id!==me?.id)pushNotif('💬 '+p.new.member_name,'메모: '+p.new.content.slice(0,40))
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'site_files'},p=>{
      if(p.new.uploaded_by_id!==me?.id)
        notifBatch('files','📷 사진 업로드',n=>n>1?`사진 ${n}장이 추가됐어요`:'현장에 새 사진이 추가됐어요')
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'site_materials'},p=>{
      if(p.new.uploaded_by_id!==me?.id){
        const nm=p.new.name
        notifBatch('mats','📦 자재 추가',n=>n>1?`'${nm}' 외 ${n-1}건이 추가됐어요`:`'${nm}' 항목이 추가됐어요`)
      }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'site_materials'},p=>{
      if(p.new.is_checked!==p.old?.is_checked&&p.new.uploaded_by_id!==me?.id)
        pushNotif('📦 자재 체크',`'${p.new.name}' ${p.new.is_checked?'완료 처리됐어요':'미완료로 변경됐어요'}`)
    })
    .subscribe(status=>{
      if(status==='SUBSCRIBED')console.log('[Realtime] 연결됨')
      else if(status==='CLOSED'||status==='CHANNEL_ERROR'){
        console.warn('[Realtime] 재연결 시도...')
        setTimeout(setupRealtime,3000)
      }
    })
}

// 관리자/대표는 전부, 팀원은 본인이 올린 것만 수정·삭제할 수 있다.
// 작성자 정보가 없는 예전 자료(uploaded_by_id 없음)는 관리자만 정리 가능.

let _memberNames=null
async function loadMemberNames(){
  if(_memberNames)return _memberNames
  const{data}=await db.from('members').select('id,name')
  _memberNames={}
  ;(data||[]).forEach(m=>_memberNames[m.id]=m.name)
  return _memberNames
}
const whoName=id=>(id&&_memberNames&&_memberNames[id])||'미상'
const toKST=ts=>{
  if(!ts)return null
  const iso=/[Zz]$|[+-]\d\d:?\d\d$/.test(ts)?ts:ts.replace(' ','T')+'Z'
  const t=new Date(iso).getTime()
  return isNaN(t)?null:new Date(t+9*36e5)
}
const dKeyOf=ts=>{const d=toKST(ts);return d?`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`:'날짜없음'}
function dLabel(key){
  if(key==='날짜없음')return key
  const t=toKST(new Date().toISOString())
  const tk=`${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`
  const yd=new Date(t.getTime()-864e5)
  const yk=`${yd.getUTCFullYear()}-${pad(yd.getUTCMonth()+1)}-${pad(yd.getUTCDate())}`
  const[y,m,d]=key.split('-').map(Number)
  const w=['일','월','화','수','목','금','토'][new Date(Date.UTC(y,m-1,d)).getUTCDay()]
  const base=`${m}월 ${d}일 (${w})`
  return key===tk?`오늘 · ${base}`:key===yk?`어제 · ${base}`:base
}
// 날짜별로 묶고 최신 날짜부터
function groupByDate(list){
  const g={}
  list.forEach(x=>{const k=dKeyOf(x.created_at);(g[k]=g[k]||[]).push(x)})
  return Object.keys(g).sort((a,b)=>b.localeCompare(a)).map(k=>({key:k,label:dLabel(k),items:g[k]}))
}

async function openSiteFiles(siteId,siteName){
  openSheet(`<div class="st">${siteName} — 현장 사진</div><div class="loading"><div class="spin"></div></div>`)
  // 사진 한 장이 80~110KB라 전부 한 번에 받으면 DB가 타임아웃난다(206장 현장에서 확인).
  // 목록은 메타데이터로 먼저 그리고 이미지는 나눠서 채운다.
  const[{data}]=await Promise.all([
    db.from('site_files').select('id,file_name,file_type,created_at,uploaded_by_id')
      .eq('site_id',siteId).order('created_at',{ascending:false}),
    loadMemberNames()
  ])
  _sitePhotos[siteId]=data||[]
  renderPhotos(siteId,siteName,false,[])
  fillPhotoData(siteId)
}

// 이미지 데이터를 20장씩 받아 채운다
async function fillPhotoData(siteId){
  const files=_sitePhotos[siteId]||[]
  const todo=files.filter(f=>!f.file_data).map(f=>f.id)
  for(let i=0;i<todo.length;i+=20){
    const chunk=todo.slice(i,i+20)
    const{data,error}=await db.from('site_files').select('id,file_data').in('id',chunk)
    if(error)break
    ;(data||[]).forEach(row=>{
      const f=files.find(x=>x.id===row.id)
      if(f)f.file_data=row.file_data
      const img=document.querySelector(`img[data-pid="${row.id}"]`)
      if(img&&!img.src.startsWith('data:')){img.src=row.file_data;img.style.background='none'}
    })
    if(!document.getElementById('sc'))return   // 시트가 닫히면 중단
  }
}

function renderPhotos(siteId,siteName,selMode,selected){
  const files=_sitePhotos[siteId]||[]
  let html=`<div class="st">${siteName} — 사진 (${files.length}장)</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <button class="bs" onclick="document.getElementById('fi-${siteId}').click()">📷 추가</button>
      <input type="file" id="fi-${siteId}" accept="image/*" multiple style="display:none" onchange="uploadPhotos('${siteId}','${siteName}',this)">
      ${files.length?`<button class="bs" style="color:var(--blue)" onclick="renderPhotos('${siteId}','${siteName}',${!selMode},[])">${selMode?'취소':'선택 다운로드'}</button>`:''}
    </div>
  `
  // 업로드 날짜별로 나눠서 보여준다 (인덱스는 원본 배열 기준을 유지해야 보기/선택이 맞는다)
  const idxOf=new Map(files.map((f,i)=>[f,i]))
  groupByDate(files).forEach(grp=>{
    const uploaders=[...new Set(grp.items.map(f=>whoName(f.uploaded_by_id)))]
    html+=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px">
      <span style="font-size:12px;font-weight:700;color:var(--navy)">${grp.label}</span>
      <span style="font-size:11px;color:var(--text2)">${grp.items.length}장 · ${uploaders.join(', ')}</span>
    </div><div class="photo-grid" style="margin-top:0">`
    grp.items.forEach(f=>{
      const i=idxOf.get(f), sel=selected.includes(i)
      html+=`<div style="position:relative;cursor:pointer" onclick="${selMode?`togglePhotoSel('${siteId}','${siteName}',${i},[${selected.join(',')}])`:`viewPhoto(${i},'${siteId}','${(f.file_name||'사진').replace(/'/g,'')}')`}">
        <img class="photo-thumb" data-pid="${f.id}" ${f.file_data?`src="${f.file_data}"`:''} style="opacity:${selMode&&!sel?0.5:1};background:var(--bg)">
        <div style="position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:9px;padding:8px 4px 3px;border-radius:0 0 8px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${whoName(f.uploaded_by_id)}</div>
        ${selMode?`<div style="position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:50%;background:${sel?'var(--blue)':'rgba(255,255,255,.85)'};border:2px solid ${sel?'var(--blue)':'#ccc'};display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700">${sel?'✓':''}</div>`:''}
        ${!selMode&&canEditId(f.uploaded_by_id)?`<button onclick="event.stopPropagation();delFile('${f.id}','${siteId}','${siteName}','${f.uploaded_by_id||''}')" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer">×</button>`:''}
      </div>`
    })
    html+='</div>'
  })
  if(!files.length) html+='<div style="text-align:center;color:var(--text2);font-size:13px;padding:24px 0">아직 사진이 없어요</div>'
  if(selMode){
    html+=`<div style="position:sticky;bottom:0;background:#fff;padding:12px 0 4px;margin-top:12px;border-top:.5px solid var(--border)">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button class="bs" style="flex:1;text-align:center" onclick="renderPhotos('${siteId}','${siteName}',true,[${files.map((_,i)=>i).join(',')}])">전체 선택</button>
        <button class="bs" style="flex:1;text-align:center" onclick="renderPhotos('${siteId}','${siteName}',true,[])">선택 해제</button>
      </div>
      <button class="btn bp" onclick="dlPhotos('${siteId}',[${selected.join(',')}])">⬇ ${selected.length}장 다운로드</button>
    </div>`
  }
  html+='<div id="up-prog" style="display:none;margin-top:14px"><div class="loading"><div class="spin"></div>업로드 중...</div></div>'
  document.getElementById('sc').innerHTML=html
}

function togglePhotoSel(siteId,siteName,idx,current){
  const sel=[...current]
  const i=sel.indexOf(idx)
  if(i>-1)sel.splice(i,1);else sel.push(idx)
  renderPhotos(siteId,siteName,true,sel)
}

async function viewPhoto(idx,siteId,name){
  const f=(_sitePhotos[siteId]||[])[idx];if(!f)return
  if(!f.file_data){   // 아직 안 받은 사진이면 그 장만 먼저 받는다
    openSheet(`<div class="st">${name||'사진'}</div><div class="loading"><div class="spin"></div>불러오는 중...</div>`)
    const{data}=await db.from('site_files').select('file_data').eq('id',f.id).single()
    if(data)f.file_data=data.file_data
    if(!f.file_data){toast('사진을 불러오지 못했어요',true);return}
  }
  openSheet(`<div class="st">${name||'사진'}</div>
    <img src="${f.file_data}" style="width:100%;border-radius:10px;margin-bottom:14px">
    <a href="${f.file_data}" download="${f.file_name||'현장사진.jpg'}" style="display:block;width:100%;padding:13px;background:var(--navy);color:#fff;border-radius:10px;text-align:center;font-size:15px;font-weight:600;text-decoration:none">⬇ 사진 다운로드</a>`)
}

async function dlPhotos(siteId,selected){
  if(!selected.length){toast('사진을 선택하세요',true);return}
  const files=_sitePhotos[siteId]||[]
  toast(`${selected.length}장 다운로드 시작...`)
  for(let i=0;i<selected.length;i++){
    await new Promise(r=>setTimeout(r,400))
    const f=files[selected[i]]
    if(!f)continue
    if(!f.file_data){   // 아직 안 받은 사진은 받아서 내려준다
      const{data}=await db.from('site_files').select('file_data').eq('id',f.id).single()
      if(!data?.file_data)continue
      f.file_data=data.file_data
    }
    const a=document.createElement('a')
    a.href=f.file_data;a.download=f.file_name||`현장사진_${i+1}.jpg`
    document.body.appendChild(a);a.click();document.body.removeChild(a)
  }
  toast(`✅ ${selected.length}장 다운로드 완료`)
}

async function uploadPhotos(siteId,siteName,input){
  const files=Array.from(input.files);if(!files.length)return
  document.getElementById('up-prog').style.display='block'
  // 한 장씩 넣으면 알림이 장수만큼 나가므로 압축 후 한 번에 저장한다
  const rows=[]
  for(const file of files){
    const b64=await compressImg(file)
    rows.push({site_id:siteId,file_name:file.name,file_data:b64,file_type:file.type,uploaded_by_id:me.id})
  }
  // 용량이 커서 한 문장에 다 담기 어려우면 20장 단위로 나눈다
  for(let i=0;i<rows.length;i+=20){
    const{error}=await db.from('site_files').insert(rows.slice(i,i+20))
    if(error){toast('업로드 실패: '+error.message,true);break}
  }
  input.value=''
  toast(`${files.length}장 업로드 완료`)
  openSiteFiles(siteId,siteName)
}

function compressImg(file){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file)
    img.onload=()=>{
      const max=900,c=document.createElement('canvas')
      let w=img.width,h=img.height
      if(w>max){h=Math.round(h*max/w);w=max}
      if(h>max){w=Math.round(w*max/h);h=max}
      c.width=w;c.height=h
      c.getContext('2d').drawImage(img,0,0,w,h)
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.78))
    };img.src=url
  })
}

async function delFile(id,siteId,siteName,ownerId){
  if(!canEditId(ownerId)){denyEdit();return}
  if(!confirm('이 사진을 삭제할까요?'))return
  await db.from('site_files').delete().eq('id',id)
  toast('삭제했어요');openSiteFiles(siteId,siteName)
}

  openSheet(`<div class="st">${siteName} — 사용자재</div><div class="loading"><div class="spin"></div></div>`)
  const[{data}]=await Promise.all([
    db.from('site_materials').select('*').eq('site_id',siteId).order('created_at'),
    loadMemberNames()
  ])

// 같은 자재가 날짜별로 나뉘어 등록되므로 품명 기준으로 합산한다
function matTotals(mats){
  const g={}
  mats.forEach(m=>{
    const k=cmpNorm(m.name)
    if(!g[k])g[k]={name:m.name,unit:cmpUnit(m.unit)||'EA',qty:0,done:0,cnt:0}
    g[k].qty+=parseFloat(m.quantity)||0
    g[k].cnt++
    if(m.is_checked)g[k].done++
  })
  return Object.values(g).sort((a,b)=>a.name.localeCompare(b.name,'ko'))
}

  _matsData=mats
  const done=mats.filter(m=>m.is_checked).length
  const pct=mats.length?Math.round(done/mats.length*100):0
  const sn=siteName.replace(/'/g,'')
  let html=`<div class="st">${siteName} — 사용자재</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:13px;color:var(--text2)">${done}/${mats.length} 완료</span>
      <div style="display:flex;gap:6px">
        ${mats.length&&me.isAdmin?`<button class="bs" style="background:var(--primary-weak);color:var(--primary-press);font-weight:700" onclick="quoteFromMaterials('${siteId}','${sn}')">🧾 견적서 만들기</button>`:''}
        ${mats.length?`<button class="bs" style="color:var(--blue)" onclick="printMatsPDF('${sn}')">📄 PDF</button>`:''}
        <button class="bs" onclick="addMatForm('${siteId}','${sn}')">+ 추가</button>
      </div>
    </div>`
  if(mats.length){
    html+=`<div style="background:var(--bg);border-radius:4px;height:6px;margin-bottom:2px;overflow:hidden"><div style="height:100%;background:var(--blue);border-radius:4px;width:${pct}%;transition:.3s"></div></div>`
    groupByDate(mats).forEach(grp=>{
      const who=[...new Set(grp.items.map(m=>whoName(m.uploaded_by_id)))]
      html+=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 4px">
        <span style="font-size:12px;font-weight:700;color:var(--navy)">${grp.label}</span>
        <span style="font-size:11px;color:var(--text2)">${grp.items.length}건 · ${who.join(', ')}</span>
      </div>`
      grp.items.forEach(m=>{
        html+=`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--border)">
          <div onclick="togMat('${m.id}',${m.is_checked},'${siteId}','${siteName}')" style="width:24px;height:24px;border-radius:6px;border:2px solid ${m.is_checked?'var(--blue)':'var(--border)'};background:${m.is_checked?'var(--blue)':'transparent'};flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700">${m.is_checked?'✓':''}</div>
          <div style="flex:1;${m.is_checked?'text-decoration:line-through;opacity:.5':''}">
            <div style="font-size:14px;font-weight:500">${m.name}</div>
            <div style="font-size:12px;color:var(--text2)">${m.quantity||0} ${cmpUnit(m.unit)||'EA'}${m.notes?' · '+m.notes:''} <span style="opacity:.75">· ${whoName(m.uploaded_by_id)}</span></div>
          </div>
          ${canEditId(m.uploaded_by_id)?`<button onclick="delMat('${m.id}','${siteId}','${siteName}','${m.uploaded_by_id||''}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:4px;line-height:1">×</button>`:''}
        </div>`
      })
    })
  }else{
    html+=`<div class="empty"><div class="ei">📦</div><div style="font-size:14px">등록된 자재가 없어요</div>${me.isAdmin?'<div style="font-size:12px;margin-top:4px;opacity:.7">+ 버튼으로 추가하세요</div>':''}</div>`
  }
  document.getElementById('sc').innerHTML=html
}

// ── 자재 일괄 추가: 견적서 작성처럼 여러 품목 수량을 한 화면에서 담고 한 번에 저장한다.
//    한 건씩 넣으면 등록도 번거롭고 알림이 건건이 나간다.
let _moQtys={}, _moCatTab=CATS[0]

async function addMatForm(siteId,siteName){
  _matSiteId=siteId; _matSiteName=siteName
  _moQtys={}; _moCatTab=CATS[0]
  await loadMatPickList()
  document.getElementById('mo-title').textContent=siteName
  document.getElementById('mo-search').value=''
  document.getElementById('mo-tabs').innerHTML=CATS.map(c=>`<button class="qo-tab${c===_moCatTab?' on':''}" onclick="setMoCat('${c}')">${c}</button>`).join('')
  renderMatBody();calcMo()
  document.getElementById('matoverlay').classList.add('on')
  closeSheet()
}
function closeMatOverlay(){
  document.getElementById('matoverlay').classList.remove('on')
  if(_matSiteId)openMaterials(_matSiteId,_matSiteName)
}
function setMoCat(c){
  _moCatTab=c
  const s=document.getElementById('mo-search');if(s)s.value=''
  document.querySelectorAll('#mo-tabs .qo-tab').forEach(b=>b.classList.toggle('on',b.textContent===c))
  renderMatBody()
}

function renderMatBody(){
  const q=(document.getElementById('mo-search')?.value||'').trim().toLowerCase()
  // 검색 중이면 카테고리를 무시하고 전체에서 찾는다
  const list=q?catalogItems.filter(i=>i.name.toLowerCase().includes(q))
              :catalogItems.filter(i=>i.cat===_moCatTab)
  const body=document.getElementById('mo-body')
  if(!list.length){
    body.innerHTML=`<div class="empty" style="padding:32px 20px"><div class="ei">📦</div><div style="font-size:13px">${q?'검색 결과가 없어요':'이 카테고리에 품목이 없어요'}</div></div>`
    return
  }
  body.innerHTML=list.map(item=>{
    const qty=_moQtys[item.id]||0, unit=cmpUnit(item.unit)||'EA'
    return `<div class="qc-item${qty>0?' active':''}" id="mo-${item.id}">
      <div class="qc-meta">
        <div class="qc-name">${item.name}</div>
        <div class="qc-sub">${[item.spec,q?item.cat:''].filter(Boolean).join(' · ')||unit}</div>
      </div>
      <div class="qc-right">
        <div class="qc-price">${unit}</div>
        <div class="qc-qty-wrap">
          <button onclick="adjMo('${item.id}',-1)">−</button>
          <input type="number" min="0" step="any" value="${qty||''}" placeholder="0"
            onchange="setMo('${item.id}',this.value)" oninput="setMo('${item.id}',this.value)">
          <button onclick="adjMo('${item.id}',1)">+</button>
        </div>
      </div>
    </div>`
  }).join('')
}
function adjMo(id,d){_moQtys[id]=Math.max(0,Math.round(((_moQtys[id]||0)+d)*100)/100);renderMatBody();calcMo()}
function setMo(id,v){
  _moQtys[id]=Math.max(0,parseFloat(v)||0)
  const el=document.getElementById('mo-'+id)
  if(el)el.className='qc-item'+(_moQtys[id]>0?' active':'')
  calcMo()
}
function calcMo(){
  const sel=Object.entries(_moQtys).filter(([,v])=>v>0)
  document.getElementById('mo-cnt').textContent=sel.length
  document.getElementById('mo-sum').textContent=sel.reduce((a,[,v])=>a+v,0).toLocaleString()+'개'
}

async function saveMatsBulk(){
  const sel=Object.entries(_moQtys).filter(([,v])=>v>0)
  if(!sel.length){toast('수량을 입력한 자재가 없어요',true);return}
  const todayKey=dKeyOf(new Date().toISOString())
  const{data:existing}=await db.from('site_materials').select('*').eq('site_id',_matSiteId)
  const inserts=[],updates=[]
  sel.forEach(([id,qty])=>{
    const item=catalogItems.find(c=>c.id===id);if(!item)return
    // 같은 날·같은 사람이 올린 같은 자재면 누적
    const hit=(existing||[]).find(r=>cmpNorm(r.name)===cmpNorm(item.name)
      &&dKeyOf(r.created_at)===todayKey&&r.uploaded_by_id===me.id)
    if(hit)updates.push({id:hit.id,quantity:(parseFloat(hit.quantity)||0)+qty})
    else inserts.push({site_id:_matSiteId,name:item.name,quantity:qty,
      unit:cmpUnit(item.unit)||'EA',is_checked:false,uploaded_by_id:me.id})
  })
  // 알림이 한 번만 가도록 INSERT 는 한 문장으로 처리한다
  if(inserts.length){
    const{error}=await db.from('site_materials').insert(inserts)
    if(error){toast('저장 실패: '+error.message,true);return}
  }
  for(const u of updates)await db.from('site_materials').update({quantity:u.quantity}).eq('id',u.id)
  toast(`자재 ${sel.length}종 등록됐어요`)
  _moQtys={}
  closeMatOverlay()
}

// 자재 선택 목록 = 견적 카탈로그 (품명을 한 곳에서만 관리한다)
// 단가는 카탈로그 관리에서 카테고리별로 수정한다
async function loadMatPickList(){
  const{data}=await db.from('catalog_items').select('*').order('sort_order').order('created_at')
  if(data)catalogItems=data.sort((a,b)=>(CATS.indexOf(a.cat)-CATS.indexOf(b.cat))||a.name.localeCompare(b.name,'ko'))
  return catalogItems
}

async function togMat(id,checked,siteId,siteName){
  await db.from('site_materials').update({is_checked:!checked}).eq('id',id)
  openMaterials(siteId,siteName)
}

async function delMat(id,siteId,siteName,ownerId){
  if(!canEditId(ownerId)){denyEdit();return}
  if(!confirm('삭제할까요?'))return
  await db.from('site_materials').delete().eq('id',id)
  toast('삭제했어요');openMaterials(siteId,siteName)
}

  const html=`<!DOCTYPE html>

async function editSite(id){showSiteForm(sites.find(x=>x.id===id))}
async function saveSite(){
  const name=document.getElementById('f-name').value.trim()
  if(!name){toast('현장명을 입력하세요',true);return}
  const data={name,client:v('f-client'),address:v('f-addr'),phone:v('f-phone'),start_date:v('f-start')||null,end_date:v('f-end')||null,status:v('f-status'),memo:v('f-memo')}

  else{await db.from('sites').insert(data);toast('추가됐어요')}

async function delSite(id){

  await db.from('sites').delete().eq('id',id);toast('삭제했어요');closeSheet();rSites()
}

// ── 현장 메모
let _memoSiteId=null,_memoSiteName='',_memoEditId=null

async function openMemos(siteId,siteName){
  _memoSiteId=siteId;_memoSiteName=siteName;_memoEditId=null
  openSheet(`<div class="st">${siteName} — 메모</div><div class="loading"><div class="spin"></div></div>`)
  await refreshMemos()
}
let _memos=[]
async function refreshMemos(){
  const{data}=await db.from('site_memos').select('*').eq('site_id',_memoSiteId).order('created_at',{ascending:false})
  _memos=data||[]
  renderMemos(_memos)
}
function renderMemos(memos){
  const listHtml=memos.length
    ?memos.map(m=>{
      const isEdit=_memoEditId===m.id
      return `<div style="background:var(--bg);border-radius:10px;padding:11px 13px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <span style="font-size:12px;font-weight:600;color:var(--navy)">${m.member_name}</span>
          <span style="font-size:11px;color:var(--text2)">${m.created_at?.slice(0,16).replace('T',' ')||''}</span>
        </div>
        ${isEdit
          ?`<textarea id="memo-edit-${m.id}" rows="3" style="width:100%;padding:9px 10px;border:.5px solid var(--navy);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);resize:none;outline:none;background:#fff;line-height:1.5">${m.content}</textarea>
            <div style="display:flex;gap:6px;margin-top:6px">
              <button onclick="saveEditMemo('${m.id}')" style="flex:1;padding:8px;border-radius:7px;background:var(--navy);color:#fff;border:none;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer">수정 완료</button>
              <button onclick="_memoEditId=null;refreshMemos()" style="padding:8px 14px;border-radius:7px;border:.5px solid var(--border);background:#fff;color:var(--text2);font-size:13px;font-family:inherit;cursor:pointer">취소</button>
            </div>`
          :`<div style="font-size:14px;color:var(--text);line-height:1.5;white-space:pre-wrap">${m.content}</div>
            <div style="display:flex;gap:10px;margin-top:6px">
              ${canEditId(m.member_id)||canEditName(m.member_name)?`
              <button onclick="_memoEditId='${m.id}';refreshMemos()" style="background:none;border:none;color:var(--blue);font-size:11px;cursor:pointer;padding:0">수정</button>
              <button onclick="delMemo('${m.id}','${m.member_id||''}','${(m.member_name||'').replace(/'/g,'')}')" style="background:none;border:none;color:#CBD5E1;font-size:11px;cursor:pointer;padding:0">삭제</button>`:''}
            </div>`
        }
      </div>`}).join('')
    :`<div style="text-align:center;padding:24px;color:var(--text2);font-size:13px">아직 메모가 없어요</div>`
  document.getElementById('sc').innerHTML=`
    <div class="st">${_memoSiteName} — 메모 (${memos.length})</div>
    <div style="margin-bottom:14px">
      <textarea id="memo-inp" rows="3" placeholder="메모 내용을 입력하세요..." style="width:100%;padding:11px 12px;border:.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);resize:none;outline:none;background:#fff;line-height:1.5"></textarea>
      <button onclick="addMemo()" style="width:100%;margin-top:6px;padding:11px;border-radius:8px;background:var(--navy);color:#fff;border:none;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer">메모 등록</button>
    </div>
    ${listHtml}`
}
async function addMemo(){
  const content=document.getElementById('memo-inp')?.value.trim()
  if(!content){toast('내용을 입력하세요',true);return}
  const{error}=await db.from('site_memos').insert({
    site_id:_memoSiteId,member_id:me.id,member_name:me.name,content
  })
  if(error){toast('저장 실패',true);return}
  toast('메모 등록됐어요')
  await refreshMemos()
}
async function saveEditMemo(id){
  const mm=(_memos||[]).find(x=>x.id===id)
  if(mm&&!(canEditId(mm.member_id)||canEditName(mm.member_name))){denyEdit();return}
  const content=document.getElementById('memo-edit-'+id)?.value.trim()
  if(!content){toast('내용을 입력하세요',true);return}
  const{error}=await db.from('site_memos').update({content}).eq('id',id)
  if(error){toast('수정 실패',true);return}
  _memoEditId=null
  toast('수정됐어요')
  await refreshMemos()
}
async function delMemo(id,ownerId,ownerName){
  if(!(canEditId(ownerId)||canEditName(ownerName))){denyEdit();return}
  if(!confirm('메모를 삭제할까요?'))return
  await db.from('site_memos').delete().eq('id',id)
  toast('삭제됐어요')
  await refreshMemos()
}

// ── 현장 도면
let _drawingSiteId=null,_drawingSiteName=''

function drawingIcon(name){
  const ext=(name.split('.').pop()||'').toLowerCase()
  if(ext==='pdf')return '📄'
  if(['dwg','dxf','dgn','plt','dwf'].includes(ext))return '📐'
  if(['png','jpg','jpeg','tif','tiff'].includes(ext))return '🖼️'
  if(['doc','docx'].includes(ext))return '📝'
  if(['xls','xlsx'].includes(ext))return '📊'
  if(['zip','rar','7z'].includes(ext))return '🗜️'
  return '📎'
}

async function openDrawings(siteId,siteName){
  _drawingSiteId=siteId;_drawingSiteName=siteName
  openSheet(`<div class="st">${siteName} — 도면</div><div class="loading"><div class="spin"></div></div>`)
  const{data}=await db.from('site_drawings').select('*').eq('site_id',siteId).order('created_at',{ascending:false})
  renderDrawings(data||[])
}

function renderDrawings(drawings){
  const siteId=_drawingSiteId,siteName=_drawingSiteName
  let html=`<div class="st">${siteName} — 도면 (${drawings.length}개)</div>
    <div style="margin-bottom:14px">
      <button class="bs" onclick="document.getElementById('drw-inp-${siteId}').click()" style="background:#F0EBFF;color:#6C3FD8;font-weight:700;padding:11px 16px">📐 도면 업로드</button>
      <input type="file" id="drw-inp-${siteId}" multiple accept=".pdf,.dwg,.dxf,.dgn,.plt,.dwf,.png,.jpg,.jpeg,.tif,.tiff,.doc,.docx,.xls,.xlsx,.zip,.rar" style="display:none" onchange="uploadDrawing('${siteId}','${siteName}',this)">
      <div id="drw-prog" style="display:none;margin-top:10px"><div class="loading"><div class="spin"></div>업로드 중...</div></div>
    </div>`
  if(!drawings.length){
    html+=`<div style="text-align:center;color:var(--text2);font-size:13px;padding:32px 0"><div style="font-size:36px;margin-bottom:8px">📐</div>등록된 도면이 없어요</div>`
  } else {
    drawings.forEach(f=>{
      const ext=(f.file_name.split('.').pop()||'').toLowerCase()
      const isPdf=ext==='pdf'
      html+=`<div style="background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:28px;flex-shrink:0">${drawingIcon(f.file_name)}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.file_name}</div>
            <div style="font-size:11px;color:var(--text2);margin-top:2px">${f.uploaded_by||'업로드'} · ${f.created_at?.slice(0,10)||''}</div>
          </div>
        </div>
        <div style="display:flex;gap:6px;margin-top:10px">
          <a href="${f.file_data}" download="${f.file_name}" style="flex:1;display:block;padding:9px;background:var(--navy);color:#fff;border-radius:8px;text-align:center;font-size:13px;font-weight:600;text-decoration:none">⬇ 다운로드</a>
          ${isPdf?`<button onclick="viewDrawingPdf('${f.id}')" style="flex:1;padding:11px;background:#F0EBFF;color:#6C3FD8;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">👁 PDF 보기</button>`:''}
          ${canEditName(f.uploaded_by)?`<button onclick="delDrawing('${f.id}','${siteId}','${siteName}','${(f.uploaded_by||'').replace(/'/g,'')}')" style="padding:9px 12px;background:none;border:.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text2);font-family:inherit;cursor:pointer">삭제</button>`:''}
        </div>
      </div>`
    })
  }
  document.getElementById('sc').innerHTML=html
}

async function uploadDrawing(siteId,siteName,input){
  const files=Array.from(input.files);if(!files.length)return
  const prog=document.getElementById('drw-prog')
  if(prog)prog.style.display='block'
  let ok=0
  for(const f of files){
    if(f.size>30*1024*1024){toast(`${f.name}: 30MB 이하 파일만 가능해요`,true);continue}
    const data=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f)})
    const{error}=await db.from('site_drawings').insert({site_id:siteId,file_name:f.name,file_data:data,file_type:f.type,uploaded_by:me.name})
    if(!error)ok++
  }
  input.value=''
  toast(ok?`${ok}개 업로드 완료`:'업로드 실패',!ok)
  openDrawings(siteId,siteName)
}

let _pdfDrawingData=null
function viewDrawingPdf(id){
  // 현재 렌더된 drawings에서 id로 찾기
  const sc=document.getElementById('sc')
  const a=sc.querySelector(`a[download]`)
  // openSheet로 iframe 표시
  const drawings=Array.from(sc.querySelectorAll('[data-drwid]'))
  // 대신 DB에서 직접 href 가져오기 - a태그 href 사용
  const allA=sc.querySelectorAll('a[download]')
  // 해당 버튼과 같은 행의 a태그를 찾는 방식 대신, 데이터 속성 활용
  // 이미 렌더된 HTML에서 직접 찾기 어려우므로 DB 재조회
  db.from('site_drawings').select('file_data,file_name').eq('id',id).single().then(({data})=>{
    if(!data)return
    const blob=new Blob([Uint8Array.from(atob(data.file_data.split(',')[1]),c=>c.charCodeAt(0))],{type:'application/pdf'})
    const url=URL.createObjectURL(blob)
    window.open(url,'_blank')
    setTimeout(()=>URL.revokeObjectURL(url),120000)
  })
}

async function delDrawing(id,siteId,siteName,ownerName){
  if(!canEditName(ownerName)){denyEdit();return}
  if(!confirm('도면을 삭제할까요?'))return
  await db.from('site_drawings').delete().eq('id',id)
  toast('삭제됐어요')
  openDrawings(siteId,siteName)

// ══════════════ 현장 정산 (견적 vs 실사용 자재) ══════════════
// 자재명과 카탈로그 품명 표기가 달라서 정규화 후 매칭한다
const cmpNorm=s=>(s||'').toUpperCase().replace(/[\s\-_()·.]/g,'')
// 카탈로그 단위가 '1'로 저장된 품목이 많아 수량 뒤에 붙으면 숫자처럼 보인다
const cmpUnit=u=>(!u||u==='1')?'':u
const cmpQty=(n,u)=>cmpUnit(u)?`${n} ${u}`:`${n}`
let _cmpSiteId=null,_cmpSiteName='',_cmpQuotes=[],_cmpQid=null,_cmpMats=[],_cmpCatalog={},_cmpLinked=false
let _insRate=4.8   // 4대보험 등 사업주 부담률 (%)

async function loadLaborSetting(){
  const{data}=await db.from('app_settings').select('value').eq('key','labor').maybeSingle()
  if(data?.value?.insurance_rate!=null)_insRate=Number(data.value.insurance_rate)
  return _insRate
}
async function saveInsRate(v){
  const r=Math.max(0,parseFloat(v)||0)
  _insRate=r
  await db.from('app_settings').upsert({key:'labor',value:{insurance_rate:r},updated_at:new Date().toISOString()},{onConflict:'key'})
  renderCompare()
}

async function openCompare(siteId,siteName){
  if(!me.isAdmin){toast('정산은 대표만 볼 수 있어요',true);return}
  _cmpSiteId=siteId;_cmpSiteName=siteName
  openSheet(`<div class="st">${siteName} — 정산</div><div class="loading"><div class="spin"></div></div>`)
  const[{data:mats},{data:qs},{data:cat}]=await Promise.all([
    db.from('site_materials').select('*').eq('site_id',siteId).order('created_at'),
    db.from('quotes').select('*').order('created_at',{ascending:false}),
    db.from('catalog_items').select('cat,name,price,cost_price,unit'),
    loadLaborSetting()
  ])
  _cmpMats=mats||[]
  _cmpCatalog={}
  ;(cat||[]).forEach(c=>{
    const k=cmpNorm(c.name)
    // 같은 품명이 여러 건이면 매입가가 있는 쪽을 우선한다
    if(!_cmpCatalog[k]||(!_cmpCatalog[k].cost&&c.cost_price))
      _cmpCatalog[k]={price:c.price||0,cost:c.cost_price||0,unit:c.unit||'',cat:c.cat||''}
  })
  // 견적서에 site_id가 없는 경우가 많아 현장명으로도 매칭한다
  const all=(qs||[]).filter(q=>me.isAdmin||q.created_by_id===me.id)
  const sn=cmpNorm(siteName)
  const linked=all.filter(q=>{
    if(q.site_id===siteId)return true
    const qn=cmpNorm(q.site_name)
    return qn&&sn&&(qn===sn||qn.includes(sn)||sn.includes(qn))
  })
  _cmpLinked=linked.length>0
  _cmpQuotes=_cmpLinked?linked:all
  // 연결된 견적서가 없으면 엉뚱한 견적서가 잡히지 않게 '없음'으로 둔다
  _cmpQid=_cmpLinked?(_cmpQuotes[0]?.id||null):null
  renderCompare()
}

function setCmpQuote(id){_cmpQid=id||null;renderCompare()}

function cmpBuildRows(q){
  const qMap={},mMap={}
  ;(q?.items||[]).forEach(i=>{
    const k=cmpNorm(i.name);if(!k)return
    if(qMap[k])qMap[k].qty+=Number(i.qty)||0
    else qMap[k]={name:i.name,unit:i.unit||'',cat:i.cat||'기타',qty:Number(i.qty)||0,price:Number(i.price)||0}
  })
  _cmpMats.forEach(m=>{
    const k=cmpNorm(m.name);if(!k)return
    if(mMap[k])mMap[k].qty+=Number(m.quantity)||0
    else mMap[k]={name:m.name,unit:m.unit||'EA',qty:Number(m.quantity)||0}
  })
  return [...new Set([...Object.keys(qMap),...Object.keys(mMap)])].map(k=>{
    const qi=qMap[k],mi=mMap[k]
    const cp=_cmpCatalog[k]
    const price=qi?qi.price:(cp?cp.price:0)   // 견적가(소매)
    const cost=cp?cp.cost:0                    // 매입가(도매)
    const qQty=qi?qi.qty:0,uQty=mi?mi.qty:0
    const cat=(cp&&cp.cat)||(qi?qi.cat:'견적 외')
    return{
      key:k,name:(qi||mi).name,unit:cmpUnit((qi&&qi.unit)||(mi&&mi.unit))||'EA',
      cat,isLabor:cat==='인건비',price,cost,
      inCatalog:!!cp,noCost:!cost,
      qQty,uQty,diff:uQty-qQty,
      qRev:qQty*price, qCost:qQty*cost, uCost:uQty*cost,
      kind:qQty===0?'extra':uQty===0?'unused':uQty>qQty?'over':uQty<qQty?'under':'same'
    }
  }).sort((a,b)=>Math.abs(b.uCost-b.qCost)-Math.abs(a.uCost-a.qCost))
}

// 자재와 인건비를 나눠 집계하고 인건비에 보험 부담률을 얹는다.
// 매출은 견적서의 공급가액(재료비+공구손료+관리비, VAT 제외)을 쓴다.
// 품목 합계만 쓰면 공구손료·관리비가 빠져 이익이 과소계산된다.
function cmpTotals(rows,q){
  const sum=(f,p)=>rows.filter(p).reduce((s,r)=>s+r[f],0)
  const mat=r=>!r.isLabor, lab=r=>r.isLabor
  const qRevMat=sum('qRev',mat), qRevLabor=sum('qRev',lab)
  const itemSum=qRevMat+qRevLabor
  const tool=Number(q?.tool_cost)||0, mg=Number(q?.margin_cost)||0
  const qRev=Number(q?.supply)||(itemSum+tool+mg)
  const matCost=sum('uCost',mat), matPlanCost=sum('qCost',mat)
  const laborCost=sum('uCost',lab)
  const insCost=Math.round(laborCost*_insRate/100)
  const totalCost=matCost+laborCost+insCost
  return{qRev,itemSum,tool,mg,qRevMat,qRevLabor,
    matCost,matPlanCost,matOverrun:matCost-matPlanCost,
    laborCost,insCost,totalCost,profit:qRev-totalCost}
}

// 현장에 등록된 실사용 자재를 소매가(견적가)로 견적서 초안으로 옮긴다.
// 바로 저장하지 않고 작성 화면을 열어 검토/수정 후 저장하게 한다.
async function quoteFromMaterials(siteId,siteName){
  if(!me.isAdmin){toast('견적서 작성은 대표만 가능해요',true);return}
  const[{data:cat},{data:mats}]=await Promise.all([
    db.from('catalog_items').select('*').order('sort_order').order('created_at'),
    db.from('site_materials').select('name,quantity').eq('site_id',siteId),
    ensureSites()
  ])
  if(!mats||!mats.length){toast('등록된 자재가 없어요',true);return}
  catalogItems=cat||[]
  const byKey={}
  catalogItems.forEach(c=>{
    const k=cmpNorm(c.name)
    if(!byKey[k]||(!byKey[k].price&&c.price))byKey[k]=c
  })
  qQtys={};qCatTab=CATS[0];_qEditId=null
  let matched=0;const missing=[],noPrice=new Set()
  mats.forEach(m=>{
    const c=byKey[cmpNorm(m.name)]
    if(!c){missing.push(m.name);return}
    qQtys[c.id]=(qQtys[c.id]||0)+(Number(m.quantity)||0)
    matched++
    if(!c.price)noPrice.add(c.name)
  })
  const site=sites.find(s=>s.id===siteId)
  renderQSiteOptions(siteId,'')
  document.getElementById('qo-client').value=site?.client||''
  document.getElementById('qo-notes').value=''
  document.getElementById('qs-tool-rate').value=3
  document.getElementById('qs-margin-rate').value=8
  document.getElementById('qo-tabs').innerHTML=CATS.map(c=>`<button class="qo-tab${c===qCatTab?' on':''}" onclick="setQCat('${c}')">${c}</button>`).join('')
  renderQBody();calcQ()
  document.querySelector('#qoverlay h2').textContent='견적서 작성 (자재 기준)'
  document.getElementById('qoverlay').classList.add('on')
  closeSheet()
  let msg=`자재 ${matched}건을 소매가로 불러왔어요`
  const warn=[]
  if(noPrice.size)warn.push(`견적가 미입력 ${noPrice.size}건`)
  if(missing.length)warn.push(`카탈로그 없음 ${missing.length}건`)
  toast(warn.length?`${msg} · ${warn.join(' · ')}`:msg,warn.length>0)
}

  // 기간이 화면 범위와 겹치는 일정 전부 (지난달에 시작해 이어지는 것 포함)
  const{data:evts}=await db.from('cal_events').select('*')
    .lte('work_date',to)
    .or(`end_date.gte.${from},and(end_date.is.null,work_date.gte.${from})`)
    .order('work_date')
  const events=evts||[]
  // ── 주 단위로 나눠, 기간 일정을 여러 칸에 걸친 하나의 띠로 그린다.
  // 날짜 칸마다 따로 그리면 칸 폭에 글씨가 갇혀 무슨 일정인지 알 수 없다.
  // 화면이 넓을수록 칸·글씨를 키운다
  const wide=innerWidth>=1024
  const MAXLANE=wide?6:4, LANE_H=wide?21:18, NUM_H=wide?30:26
  const FS_BAR=wide?12:10.5, FS_NUM=wide?14:12, NUM_D=wide?26:22
  const dkey=kd
  const parse=s=>new Date(s+'T00:00:00')
  const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/864e5)

  // 달력 첫 칸(첫 주 일요일)부터 주 단위로 끊는다
  const gridStart=gs
  const weeks=[]
  for(let w=0;w*7<fd+dim;w++){
    const ws=new Date(gridStart);ws.setDate(ws.getDate()+w*7)
    const we=new Date(ws);we.setDate(we.getDate()+6)
    weeks.push({s:dkey(ws),e:dkey(we),days:Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d})})
  }

  let cal=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <button class="bs" onclick="scMo>0?scMo--:(scY--,scMo=11);rSchedule()">◀</button>
    <span style="font-size:19px;font-weight:700;letter-spacing:-.03em;color:var(--text)">${scY}년 ${scMo+1}월</span>
    <button class="bs" onclick="scMo<11?scMo++:(scY++,scMo=0);rSchedule()">▶</button>
  </div>
  <div class="cal-wrap">
    <div class="cal-head">
      ${days.map((d,i)=>`<div style="text-align:center;font-size:${wide?13:12}px;font-weight:600;color:${i===0?'#F04452':i===6?'#3182F6':'var(--text2)'};padding:${wide?11:10}px 0">${d}</div>`).join('')}
    </div>
    <div class="cal-body">`

  weeks.forEach(wk=>{
    // 이 주에 걸치는 일정을 레인(줄)에 배치. 긴 일정을 위쪽에 둔다.
    const segs=[]
    events.forEach(e=>{
      const s=e.work_date, en=e.end_date||e.work_date
      if(!s||en<wk.s||s>wk.e)return
      const c1=Math.max(0,dayDiff(wk.s,s))
      const c2=Math.min(6,dayDiff(wk.s,en))
      segs.push({e,c1,c2,span:c2-c1+1,len:dayDiff(s,en)+1,cutL:s<wk.s,cutR:en>wk.e})
    })
    segs.sort((a,b)=>(b.len-a.len)||(a.c1-b.c1)||String(a.e.work_date).localeCompare(b.e.work_date))
    const lanes=[]   // lanes[i] = 7칸 점유 배열
    const over=[0,0,0,0,0,0,0]
    segs.forEach(sg=>{
      let li=lanes.findIndex(l=>{for(let c=sg.c1;c<=sg.c2;c++)if(l[c])return false;return true})
      if(li<0&&lanes.length<MAXLANE){lanes.push([0,0,0,0,0,0,0]);li=lanes.length-1}
      if(li<0){for(let c=sg.c1;c<=sg.c2;c++)over[c]++;sg.lane=-1;return}
      for(let c=sg.c1;c<=sg.c2;c++)lanes[li][c]=1
      sg.lane=li
    })
    const laneCount=Math.max(1,lanes.length)+(over.some(n=>n)?1:0)
    const minH=NUM_H+laneCount*LANE_H+3   // 이 주에 필요한 최소 높이 (남는 공간은 균등 분배)

    cal+=`<div class="cal-week" style="min-height:${minH}px">
      <div class="cal-days">
        ${wk.days.map((d,i)=>{
          const ds=dkey(d),inMo=d.getMonth()===scMo,isT=ds===td,dow=d.getDay()
          return `<div onclick="openDateSheet('${ds}')" style="border-right:${i===6?'none':'1px solid var(--border)'};background:${isT?'#F0F6FF':inMo?'#fff':'#FAFBFC'};cursor:pointer">
            <div style="width:${NUM_D}px;height:${NUM_D}px;border-radius:50%;background:${isT?'var(--primary)':'transparent'};color:${isT?'#fff':!inMo?'#C4CBD3':dow===0?'#F04452':dow===6?'#3182F6':'var(--text)'};display:flex;align-items:center;justify-content:center;margin:3px auto 0;font-size:${FS_NUM}px;font-weight:${isT?700:500}">${d.getDate()}</div>
          </div>`
        }).join('')}
      </div>
      <div style="position:absolute;top:${NUM_H}px;left:0;right:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:${LANE_H}px;pointer-events:none">
        ${segs.filter(sg=>sg.lane>=0).map(sg=>{
          const e=sg.e
          const rl=sg.cutL?'0':'3px', rr=sg.cutR?'0':'3px'
          return `<div onclick="event.stopPropagation();openDateSheet('${dkey(wk.days[sg.c1])}')" title="${e.title}"
            style="grid-column:${sg.c1+1} / span ${sg.span};grid-row:${sg.lane+1};background:${e.color||'#3182F6'};color:#fff;
            border-radius:${rl} ${rr} ${rr} ${rl};margin:0 ${sg.cutR?'0':'2px'} 2px ${sg.cutL?'0':'2px'};padding:0 4px;
            font-size:${FS_BAR}px;font-weight:500;line-height:${LANE_H-3}px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
            text-align:${sg.span>1?'center':'left'};cursor:pointer;pointer-events:auto">${sg.cutL?'‹ ':''}${e.title}</div>`
        }).join('')}
        ${over.map((n,c)=>n?`<div style="grid-column:${c+1};grid-row:${laneCount};font-size:${wide?11:9.5}px;color:var(--text2);padding-left:4px;pointer-events:none">+${n}</div>`:'').join('')}
      </div>
    </div>`
  })
  cal+=`</div></div>`

  document.getElementById('main').innerHTML=cal
}

function openEvtAdd(date){
  editId=null
  evtMems=[]
  const[,mo,d]=date.split('-')
  const cHtml=ECOLS.map((c,i)=>`<div onclick="pickEvtCol('${c}')" data-c="${c}" style="width:28px;height:28px;border-radius:50%;background:${c};cursor:pointer;border:${i===0?'3px solid #333':'3px solid transparent'};box-sizing:border-box"></div>`).join('')
  const mHtml=members.map(m=>`<div id="em-${m.id}" onclick="togEvtM('${m.id}')" style="padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:.5px solid var(--border);background:var(--white);color:var(--text2)">${m.name}</div>`).join('')
  openSheet(`<div class="st">${mo}월 ${parseInt(d)}일 — 일정 추가</div>
    <div class="fg"><label class="fl">일정명 *</label><input class="fi" id="ev-title" placeholder="예) 강남빌딩 전기공사 착공"></div>
    <div class="fr">
      <div class="fg"><label class="fl">시작일</label><input class="fi" id="ev-s" type="date" value="${date}"></div>
      <div class="fg"><label class="fl">종료일</label><input class="fi" id="ev-e" type="date" value="${date}"></div>
    </div>
    <div class="fg"><label class="fl">색상</label><div id="ev-cols" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${cHtml}</div><input type="hidden" id="ev-col" value="${ECOLS[0]}"></div>
    <div class="fg"><label class="fl">참여 팀원 (복수 선택 가능)</label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${mHtml}</div></div>
    <div class="fg"><label class="fl">메모</label><textarea class="fi" id="ev-notes" rows="2" placeholder="특이사항"></textarea></div>

function pickEvtCol(c){
  document.getElementById('ev-col').value=c
  document.querySelectorAll('#ev-cols div').forEach(d=>{d.style.border=d.dataset.c===c?'3px solid #333':'3px solid transparent'})
}

function togEvtM(id){
  const i=evtMems.indexOf(id),el=document.getElementById('em-'+id)
  if(i>-1){evtMems.splice(i,1);el.style.background='var(--white)';el.style.color='var(--text2)';el.style.borderColor='var(--border)'}
  else{evtMems.push(id);el.style.background='var(--navy)';el.style.color='#fff';el.style.borderColor='var(--navy)'}
}

async function saveEvt(){
  const title=document.getElementById('ev-title').value.trim()
  if(!title){toast('일정명을 입력하세요',true);return}
  const s=v('ev-s')||today()
  const e=v('ev-e')||s
  if(e<s){toast('종료일이 시작일보다 앞이에요',true);return}
  const data={
    title,
    work_date:s,
    end_date:e,
    color:document.getElementById('ev-col').value,
    notes:v('ev-notes')
  }
  if(editId){
    await db.from('cal_events').update(data).eq('id',editId)
    await db.from('cal_event_members').delete().eq('event_id',editId)
    if(evtMems.length) await db.from('cal_event_members').insert(evtMems.map(mid=>({event_id:editId,member_id:mid})))
    toast('일정이 수정됐어요')
    editId=null
  }else{
    const{data:evt}=await db.from('cal_events').insert(data).select().single()
    if(evt&&evtMems.length) await db.from('cal_event_members').insert(evtMems.map(mid=>({event_id:evt.id,member_id:mid})))
    toast('일정 추가됐어요')
  }
  closeSheet();rSchedule()
}

// 날짜 시트 — 해당 날 일정 목록 + 추가 버튼
async function openDateSheet(date){
  const[,mo,d]=date.split('-')
  openSheet(`<div class="st">${mo}월 ${parseInt(d)}일</div><div class="loading"><div class="spin"></div></div>`)
  // 그 날짜에 걸쳐 있는 일정 전부 (기간 중간 날짜를 눌러도 보이게)
  const{data:evts}=await db.from('cal_events').select('*')
    .lte('work_date',date)
    .or(`end_date.gte.${date},and(end_date.is.null,work_date.eq.${date})`)
    .order('work_date')
  const events=evts||[]
  // 팀원 이름 조회
  let emMap={}
  if(events.length){
    const ids=events.map(e=>e.id)
    const{data:ems}=await db.from('cal_event_members').select('event_id,member:members(name)').in('event_id',ids)
    ;(ems||[]).forEach(em=>{if(!emMap[em.event_id])emMap[em.event_id]=[];emMap[em.event_id].push(em.member?.name||'')})
  }
  let html=`<div class="st">${mo}월 ${parseInt(d)}일 일정</div>`
  if(events.length){
    events.forEach(e=>{
      const names=(emMap[e.id]||[]).filter(Boolean).join(', ')
      html+=`<div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:.5px solid var(--border)">
        <div style="width:10px;height:40px;border-radius:5px;background:${e.color||'#3182F6'};flex-shrink:0"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.title}</div>
          ${(e.end_date&&e.end_date!==e.work_date)?`<div style="font-size:11px;color:var(--blue);margin-top:2px;font-weight:500">📅 ${e.work_date} ~ ${e.end_date} (${Math.round((new Date(e.end_date)-new Date(e.work_date))/864e5)+1}일)</div>`:''}
          ${names?`<div style="font-size:12px;color:var(--text2);margin-top:2px">${names}</div>`:''}
          ${e.notes?`<div style="font-size:11px;color:var(--text2);margin-top:1px;opacity:.8">${e.notes}</div>`:''}
        </div>
        ${me.isAdmin?`<div style="display:flex;gap:6px;flex-shrink:0">
          <button onclick="openEvtEdit('${e.id}')" style="background:var(--bg);border:.5px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--navy);font-family:inherit;font-weight:500">수정</button>
          <button onclick="confirmDelEvt('${e.id}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:20px;padding:2px;line-height:1">×</button>
        </div>`:''}
      </div>`
    })
  }else{
    html+=`<div style="text-align:center;padding:24px 0;color:var(--text2);font-size:13px">이 날 등록된 일정이 없어요</div>`
  }
  if(me.isAdmin){
    html+=`<button class="btn bp" style="margin-top:16px" onclick="openEvtAdd('${date}')">+ 일정 추가하기</button>`
  }
  document.getElementById('sc').innerHTML=html
}

// 일정 수정 폼
async function openEvtEdit(id){
  const{data:e}=await db.from('cal_events').select('*').eq('id',id).single()
  if(!e)return
  const{data:ems}=await db.from('cal_event_members').select('member_id').eq('event_id',id)
  const selMems=(ems||[]).map(em=>em.member_id)
  editId=id
  evtMems=[...selMems]
  const cHtml=ECOLS.map(c=>`<div onclick="pickEvtCol('${c}')" data-c="${c}" style="width:28px;height:28px;border-radius:50%;background:${c};cursor:pointer;border:${e.color===c?'3px solid #333':'3px solid transparent'};box-sizing:border-box"></div>`).join('')
  const mHtml=members.map(m=>{
    const sel=selMems.includes(m.id)
    return `<div id="em-${m.id}" onclick="togEvtM('${m.id}')" style="padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:.5px solid ${sel?'var(--navy)':'var(--border)'};background:${sel?'var(--navy)':'var(--white)'};color:${sel?'#fff':'var(--text2)'}">${m.name}</div>`
  }).join('')
  openSheet(`<div class="st">일정 수정</div>
    <div class="fg"><label class="fl">일정명 *</label><input class="fi" id="ev-title" value="${e.title}"></div>
    <div class="fr">
      <div class="fg"><label class="fl">시작일</label><input class="fi" id="ev-s" type="date" value="${e.work_date}"></div>
      <div class="fg"><label class="fl">종료일</label><input class="fi" id="ev-e" type="date" value="${e.end_date||e.work_date}"></div>
    </div>
    <div class="fg"><label class="fl">색상</label><div id="ev-cols" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${cHtml}</div><input type="hidden" id="ev-col" value="${e.color||ECOLS[0]}"></div>
    <div class="fg"><label class="fl">참여 팀원</label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${mHtml}</div></div>
    <div class="fg"><label class="fl">메모</label><textarea class="fi" id="ev-notes" rows="2">${e.notes||''}</textarea></div>
    <button class="btn bp" onclick="saveEvt()">수정 완료</button>
    <button class="btn bg-r" onclick="confirmDelEvt('${id}')">일정 삭제</button>`)
}

async function confirmDelEvt(id){
  if(!confirm('이 일정을 삭제할까요?'))return
  await db.from('cal_events').delete().eq('id',id)
  toast('삭제됐어요');closeSheet();rSchedule()
}

// ══ 카탈로그 관리 (관리자) ══

  catalogItems=data||[]
  catMgrTab=CATS[0];catAddOpen=false
  document.getElementById('cat-tabs').innerHTML=CATS.map(c=>`<button class="qo-tab${c===catMgrTab?' on':''}" onclick="setCatMgrTab('${c}')">${c}</button>`).join('')
  renderCatMgr()
  document.getElementById('catoverlay').classList.add('on')
}
function closeCatalogMgr(){document.getElementById('catoverlay').classList.remove('on');catAddOpen=false}
function setCatMgrTab(c){catMgrTab=c;catAddOpen=false;document.querySelectorAll('#cat-tabs .qo-tab').forEach(b=>b.classList.toggle('on',b.textContent===c));renderCatMgr()}

      </div>

        <div class="fg"><label class="fl">매입가 (도매)</label><input class="fi" type="number" id="ci-cost" value="${i?.cost_price||''}" placeholder="0" min="0" oninput="cmMarginPreview()" style="background:#fff"></div>

      </div>

      <div style="display:flex;gap:8px;margin-top:4px">
        <button onclick="${id?`updateCatItem('${id}')`:'saveCatItem()'}" style="flex:1;padding:11px;border-radius:8px;background:var(--navy);color:#fff;border:none;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap">${id?'수정 완료':'저장'}</button>
        <button onclick="catAddOpen=false;catEditId=null;renderCatMgr()" style="padding:11px 16px;border-radius:8px;border:.5px solid var(--border);background:#fff;color:var(--text2);font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap">취소</button>

}

// 매입가 대비 견적가 마진
function cmMargin(cost,price){
  cost=Number(cost)||0;price=Number(price)||0
  if(!cost)return null
  return{won:price-cost,pct:(price-cost)/cost*100}
}
function cmMarginLabel(i){
  const m=cmMargin(i.cost_price,i.price)
  if(!m)return '<span style="color:#DC2626">매입가 미입력</span>'
  return `마진 ${m.won>=0?'+':'−'}${Math.abs(m.won).toLocaleString()} (${m.pct.toFixed(0)}%)`
}
function cmMarginColor(i){
  const m=cmMargin(i.cost_price,i.price)
  if(!m)return '#DC2626'
  return m.won<0?'#DC2626':m.pct<10?'#D97706':'#059669'
}
function cmMarginPreview(){
  const el=document.getElementById('ci-margin');if(!el)return
  const cost=parseInt(document.getElementById('ci-cost')?.value||0)
  const price=parseInt(document.getElementById('ci-price')?.value||0)
  const m=cmMargin(cost,price)
  if(!m){el.innerHTML='';return}
  const c=m.won<0?'#DC2626':m.pct<10?'#D97706':'#059669'
  el.innerHTML=`<span style="color:${c}">마진 ${m.won>=0?'+':'−'}${Math.abs(m.won).toLocaleString()}원 (${m.pct.toFixed(1)}%)${m.won<0?' ⚠️ 역마진':''}</span>`
}

// ══ 견적서 작성 ══
// 견적서를 현장에 연결해두면 정산에서 자동으로 매칭된다.
// 계약 전 견적도 있으므로 '직접 입력'을 남겨둔다 (이때 site_id는 null)
async function ensureSites(){
  if(sites&&sites.length)return sites
  const{data}=await db.from('sites').select('*').order('created_at',{ascending:false})
  sites=data||[]
  return sites
}
function renderQSiteOptions(siteId,siteName){
  const manual=!siteId&&!!siteName
  document.getElementById('qo-site-sel').innerHTML=
    `<option value="">현장을 선택하세요</option>`
    +sites.map(s=>`<option value="${s.id}" ${s.id===siteId?'selected':''}>${s.name}</option>`).join('')
    +`<option value="__manual" ${manual?'selected':''}>➕ 직접 입력 (현장 미등록)</option>`
  document.getElementById('qo-site-manual').style.display=manual?'block':'none'
  document.getElementById('qo-site-name').value=manual?siteName:''
}
function onQSiteChange(){
  const v=document.getElementById('qo-site-sel').value
  const manual=v==='__manual'
  document.getElementById('qo-site-manual').style.display=manual?'block':'none'
  if(manual){document.getElementById('qo-site-name').focus();qBarText();return}
  const s=sites.find(x=>x.id===v)
  if(s&&s.client)document.getElementById('qo-client').value=s.client
  qBarText()
  if(s)foldQInfo(true)   // 현장을 골랐으면 입력칸을 접어 자재 목록에 자리를 내준다
}
// ── 견적 작성 화면 접기/펼치기
function qBarText(){
  const{site_name}=getQSite()
  const client=document.getElementById('qo-client').value.trim()
  document.getElementById('qo-bar-txt').innerHTML=
    `현장 <b>${site_name||'미선택'}</b>${client?` · 발주처 <b>${client}</b>`:''}`
}
function foldQInfo(fold){
  document.getElementById('qo-info').classList.toggle('fold',fold)
  document.getElementById('qo-bar-car').textContent=fold?'펼치기 ▼':'접기 ▲'
  qBarText()
}
function toggleQInfo(){foldQInfo(!document.getElementById('qo-info').classList.contains('fold'))}
function toggleQDetail(){
  const d=document.getElementById('qo-detail')
  const fold=!d.classList.contains('fold')
  d.classList.toggle('fold',fold)
  document.getElementById('qo-detail-car').textContent=fold?'상세 ▼':'상세 ▲'
}
function getQSite(){
  const v=document.getElementById('qo-site-sel').value
  if(v&&v!=='__manual'){
    const s=sites.find(x=>x.id===v)
    return{site_id:v,site_name:s?s.name:''}
  }
  return{site_id:null,site_name:document.getElementById('qo-site-name').value.trim()}
}

function adjQty(id,d){qQtys[id]=Math.max(0,(qQtys[id]||0)+d);renderQBody();calcQ()}
