<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도아전기">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A3A5C">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>도아전기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--navy:#1A3A5C;--blue:#2E6DA4;--bg:#F2F5FA;--white:#fff;--border:#DDE6F0;--text:#1A3A5C;--text2:#758AA0;--red:#EF4444}
body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100vh}
#login{display:flex;flex-direction:column;align-items:center;padding:60px 20px 40px;min-height:100vh;background:#fff}
.login-logo{font-size:52px;margin-bottom:16px}
.login-title{font-size:24px;font-weight:700;color:var(--navy);margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:36px}
.login-card{background:var(--white);border:.5px solid var(--border);border-radius:16px;width:100%;padding:20px;margin-bottom:12px}
.login-lbl{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.login-member{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--border);cursor:pointer}
.login-member:last-child{border-bottom:none}
.login-member:active{opacity:.7}
.login-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.admin-btn{width:100%;padding:14px;border-radius:12px;background:var(--navy);border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
#hdr{background:var(--navy);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
#hdr h1{font-size:17px;font-weight:600}
#hdr p{font-size:11px;opacity:.65;margin-top:1px}
#hdr-right{display:flex;align-items:center;gap:8px}
#hdr-av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
#logout-btn{font-size:11px;color:rgba(255,255,255,.55);background:none;border:none;cursor:pointer;font-family:inherit}
#main{padding:14px 12px 80px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:.5px solid var(--border);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 0 12px;z-index:100}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0;border:none;background:none;color:var(--text2);font-size:9px;font-family:inherit}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--navy);font-weight:600}
.card{background:var(--white);border:.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--white);border:.5px solid var(--border);border-radius:10px;padding:12px 14px}
.stat-n{font-size:26px;font-weight:600;color:var(--navy)}
.stat-l{font-size:11px;color:var(--text2);margin-top:2px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.bi{background:#DBEAFE;color:#1D4ED8}.bd{background:#D1FAE5;color:#065F46}.bw{background:#FEF3C7;color:#92400E}.bh{background:#F1F5F9;color:#64748B}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sec-t{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.sec-a{font-size:12px;color:var(--blue);font-weight:500;cursor:pointer;background:none;border:none;font-family:inherit}
.fab{position:fixed;bottom:76px;right:50%;transform:translateX(215px);width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;border:none;cursor:pointer;font-size:28px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(26,58,92,.4);z-index:99;line-height:1}
#sbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200}
#sbg.on{display:block}
#sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;background:var(--white);border-radius:18px 18px 0 0;padding:20px 16px 28px;z-index:201;transition:transform .28s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto}
#sheet.on{transform:translateX(-50%) translateY(0)}
.sh{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.st{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--navy)}
.fg{margin-bottom:12px}
.fl{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block}
.fi{width:100%;padding:11px 12px;border:.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);background:var(--white);outline:none;appearance:none;-webkit-appearance:none}
.fi:focus{border-color:var(--blue)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.bp{background:var(--navy);color:#fff}.bp:active{background:var(--blue)}
.bg-r{background:transparent;color:var(--red);margin-top:8px}
.bs{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:.5px solid var(--border);background:var(--white);color:var(--navy)}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:500;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.li{background:var(--white);border:.5px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.lt{font-size:15px;font-weight:600;color:var(--text);margin-bottom:3px}
.ls{font-size:12px;color:var(--text2)}
.lm{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.la{display:flex;gap:6px;margin-top:10px;border-top:.5px solid var(--border);padding-top:10px;flex-wrap:wrap}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.empty{text-align:center;padding:48px 20px;color:var(--text2)}
.ei{font-size:40px;margin-bottom:10px;opacity:.35}
.fc{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.fc::-webkit-scrollbar{display:none}
.fcc{flex-shrink:0;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:.5px solid var(--border);background:var(--white);color:var(--text2)}
.fcc.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.loading{display:flex;align-items:center;justify-content:center;padding:48px;gap:10px;color:var(--text2);font-size:13px}
.spin{width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.qt{width:100%;border-collapse:collapse;font-size:13px}
.qt th{background:var(--navy);color:#fff;padding:8px 10px;text-align:left;font-weight:500}
.qt td{padding:8px 10px;border-bottom:.5px solid var(--border)}
.qt tr:nth-child(even) td{background:var(--bg)}
/* 사진 그리드 */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.photo-thumb{aspect-ratio:1;border-radius:8px;object-fit:cover;width:100%;cursor:pointer}
.photo-add{aspect-ratio:1;border-radius:8px;border:1.5px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--bg);color:var(--text2);gap:4px;font-size:24px}
.photo-add span{font-size:11px}
/* 근태 캘린더 */
.att-wrap{background:var(--white);border-radius:12px;padding:14px;margin-bottom:10px}
.att-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.att-month-title{font-size:15px;font-weight:600;color:var(--navy)}
.att-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}
.att-dh{text-align:center;font-size:10px;font-weight:600;color:var(--text2);padding-bottom:4px}
.att-day{aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:.5px solid var(--border);background:var(--white);position:relative;user-select:none}
.att-day.worked{background:var(--navy);color:#fff;border-color:var(--navy)}
.att-day.overtime{background:var(--blue);color:#fff;border-color:var(--blue)}
.att-day.future{opacity:.3;cursor:default}
.att-day.blank{border-color:transparent;background:transparent;cursor:default}
.att-day.istoday{outline:2px solid var(--blue);outline-offset:1px}
.att-ot-dot{font-size:7px;position:absolute;bottom:2px;letter-spacing:-.5px;font-weight:700}
.att-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.att-sum{background:var(--bg);border-radius:8px;padding:10px;text-align:center}
.att-sum-n{font-size:20px;font-weight:700;color:var(--navy)}
.att-sum-l{font-size:11px;color:var(--text2);margin-top:2px}
.att-legend{display:flex;gap:12px;margin-bottom:10px;font-size:11px;color:var(--text2)}
.att-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
/* 관리자 근태 바 */
.mem-att-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--border);cursor:pointer}
.mem-att-row:last-child{border-bottom:none}
.att-bar-wrap{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.att-bar-fill{height:100%;background:var(--navy);border-radius:3px}
/* ── 전체화면 오버레이 공통 ── */
.full-ov{display:none;position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);background:var(--bg);z-index:250;flex-direction:column;overflow:hidden}
.full-ov.on{display:flex}
.qo-hdr{background:var(--navy);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.qo-hdr h2{font-size:16px;font-weight:600;flex:1}
.qo-back{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;line-height:1;padding:0 4px;font-family:inherit}
.qo-info{background:#fff;padding:12px 14px;border-bottom:.5px solid var(--border);flex-shrink:0}
.qo-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qo-tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:.5px solid var(--border);flex-shrink:0}
.qo-tabs::-webkit-scrollbar{display:none}
.qo-tab{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:.5px solid var(--border);background:#fff;color:var(--text2);font-family:inherit}
.qo-tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.qo-body{flex:1;overflow-y:auto;padding:10px 12px}
/* 견적 작성 – 카탈로그 품목 행 */
.qc-item{background:#fff;border:.5px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.qc-item.active{border-color:var(--navy);background:#EEF4FB}
.qc-meta{flex:1;min-width:0}
.qc-name{font-size:14px;font-weight:600;color:var(--text)}
.qc-sub{font-size:11px;color:var(--text2);margin-top:2px}
.qc-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.qc-price{font-size:12px;color:var(--text2)}
.qc-qty-wrap{display:flex;align-items:center;gap:5px}
.qc-qty-wrap button{width:26px;height:26px;border-radius:6px;border:.5px solid var(--border);background:#fff;font-size:15px;cursor:pointer;line-height:1;color:var(--navy);font-family:inherit}
.qc-qty-wrap input{width:42px;height:26px;border:.5px solid var(--border);border-radius:6px;font-size:13px;text-align:center;font-family:inherit;color:var(--text);outline:none}
.qc-subtotal{font-size:12px;font-weight:700;color:var(--navy)}
/* 하단 합계 */
.qo-foot{flex-shrink:0;background:#fff;border-top:.5px solid var(--border);padding:10px 14px 18px}
.qo-sum-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px}
.qo-sum-label{color:var(--text2)}
.qo-sum-rate{display:flex;align-items:center;gap:4px}
.qo-rate-inp{width:38px;padding:3px 4px;border:.5px solid var(--border);border-radius:6px;font-size:12px;text-align:center;font-family:inherit;color:var(--navy);font-weight:600;outline:none}
.qo-sum-val{font-weight:500;color:var(--text)}
.qo-divider{border:none;border-top:.5px solid var(--border);margin:5px 0}
.qo-grand{display:flex;justify-content:space-between;align-items:center;padding:7px 0 10px}
.qo-grand-label{font-size:15px;font-weight:700;color:var(--navy)}
.qo-grand-val{font-size:17px;font-weight:800;color:var(--navy)}
/* 카탈로그 관리 품목 행 */
.cm-item{background:#fff;border:.5px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.cm-meta{flex:1;min-width:0}
.cm-name{font-size:14px;font-weight:600;color:var(--text)}
.cm-sub{font-size:11px;color:var(--text2);margin-top:2px}
.cm-price{font-size:14px;font-weight:700;color:var(--navy);text-align:right;flex-shrink:0}
.cm-edit{background:none;border:none;color:#94A3B8;font-size:16px;cursor:pointer;padding:0 2px;line-height:1}
.cm-edit:active{color:var(--navy)}
.cm-del{background:none;border:none;color:#CBD5E1;font-size:20px;cursor:pointer;padding:0 2px;line-height:1}
.cm-del:active{color:var(--red)}
/* PDF 인쇄 */
@media print{body>*{display:none!important}#printarea{display:block!important;position:fixed;inset:0;background:#fff;z-index:9999}}
#printarea{display:none}
</style>
</head>

async function showLogin(){
  document.getElementById('login').style.display='flex'
  document.getElementById('app').style.display='none'
  const{data}=await db.from('members').select('*').order('created_at')
  members=data||[]
  const list=document.getElementById('login-list')
  if(!members.length){
    list.innerHTML='<div class="login-lbl">팀원 선택</div><div style="text-align:center;color:var(--text2);padding:20px;font-size:13px">관리자로 먼저 로그인해서<br>팀원을 추가하세요</div>'
    return
  }
  list.innerHTML='<div class="login-lbl">팀원 선택</div>'+members.map((m,i)=>{
    const[bg,fg]=COLORS[i%COLORS.length].split(':')
    return `<div class="login-member" onclick="askPassword('${m.id}','${m.name}','${m.role||'내선전공'}')">
      <div class="login-av" style="background:${bg};color:${fg}">${m.name[0]}</div>
      <div style="flex:1"><div style="font-size:15px;font-weight:500;color:var(--text)">${m.name}</div><div style="font-size:12px;color:var(--text2)">${m.role||'내선전공'}</div></div>
      <div style="font-size:18px;color:var(--text2)">›</div>
    </div>`
  }).join('')
}

function askPassword(id,name,role){
  // 비밀번호 미설정 팀원은 바로 입력 화면으로
  openSheet(`
    <div class="sh"></div>
    <div style="text-align:center;margin-bottom:20px">
      <div style="width:52px;height:52px;border-radius:50%;background:#E8F0F8;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;margin:0 auto 10px">${name[0]}</div>
      <div style="font-size:17px;font-weight:600;color:var(--navy)">${name}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:3px">${role}</div>
    </div>
    <div class="fg">
      <label class="fl">비밀번호</label>
      <input class="fi" type="password" id="pw-inp" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin('${id}','${name}')">
    </div>
    <button class="btn bp" onclick="doLogin('${id}','${name}')">로그인</button>
  `)
  setTimeout(()=>document.getElementById('pw-inp')?.focus(),300)
}

async function doLogin(id,name){
  const pw=document.getElementById('pw-inp')?.value||''
  const{data}=await db.from('members').select('password').eq('id',id).single()
  const savedPw=data?.password||''

  if(savedPw===''&&pw===''){
    // 비밀번호 미설정 → 최초 설정 안내
    document.getElementById('sc').innerHTML=`
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:36px;margin-bottom:10px">🔐</div>
        <div style="font-size:16px;font-weight:600;color:var(--navy)">처음 로그인이에요!</div>
        <div style="font-size:13px;color:var(--text2);margin-top:6px">사용할 비밀번호를 설정해주세요</div>
      </div>
      <div class="fg"><label class="fl">새 비밀번호</label><input class="fi" type="password" id="pw-new" placeholder="비밀번호 입력"></div>
      <div class="fg"><label class="fl">비밀번호 확인</label><input class="fi" type="password" id="pw-new2" placeholder="다시 입력"></div>
      <button class="btn bp" onclick="setFirstPassword('${id}','${name}')">비밀번호 설정하기</button>
    `
    return
  }

  if(pw!==savedPw){
    toast('비밀번호가 틀렸어요',true)
    document.getElementById('pw-inp').value=''
    document.getElementById('pw-inp').focus()
    return
  }

  closeSheet()
  me={id,name,isAdmin:false}
  localStorage.setItem('doa_user',JSON.stringify(me))
  showApp();go('home')
}

async function setFirstPassword(id,name){
  const pw1=document.getElementById('pw-new')?.value||''
  const pw2=document.getElementById('pw-new2')?.value||''
  if(!pw1){toast('비밀번호를 입력하세요',true);return}
  if(pw1!==pw2){toast('비밀번호가 일치하지 않아요',true);return}
  if(pw1.length<4){toast('4자리 이상 입력하세요',true);return}
  await db.from('members').update({password:pw1}).eq('id',id)
  closeSheet()
  me={id,name,isAdmin:false}
  localStorage.setItem('doa_user',JSON.stringify(me))
  showApp();go('home')
  toast('비밀번호가 설정됐어요 ✓')
}

function loginAs(id,name){
  me={id,name,isAdmin:false}
  localStorage.setItem('doa_user',JSON.stringify(me))

// ── 알림 권한 + Realtime
async function requestNotifPermission(){
  if('Notification' in window && Notification.permission==='default'){
    await Notification.requestPermission()
  }
}
function pushNotif(title,body){
  toast(title+' '+body)
  if('Notification' in window && Notification.permission==='granted'){
    navigator.serviceWorker?.ready.then(reg=>{
      reg.showNotification(title,{body,icon:'./icon-192.png',badge:'./icon-192.png',vibrate:[200,100,200]})
    }).catch(()=>new Notification(title,{body,icon:'./icon-192.png'}))
  }
}
function setupRealtime(){
  if(window._realtimeCh)db.removeChannel(window._realtimeCh)
  window._realtimeCh=db.channel('doa-updates')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'site_memos'},p=>{
      if(p.new.member_id!==me?.id)pushNotif('💬 '+p.new.member_name,'메모: '+p.new.content.slice(0,40))
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'site_files'},p=>{
      pushNotif('📷 사진 업로드','현장에 새 사진이 추가됐어요')
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'site_materials'},p=>{
      pushNotif('📦 자재 추가',`'${p.new.name}' 항목이 추가됐어요`)
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'site_materials'},p=>{
      if(p.new.is_checked!==p.old?.is_checked)
        pushNotif('📦 자재 체크',`'${p.new.name}' ${p.new.is_checked?'완료 처리됐어요':'미완료로 변경됐어요'}`)
    })
    .subscribe(status=>{
      if(status==='SUBSCRIBED')console.log('[Realtime] 연결됨')
      else if(status==='CLOSED'||status==='CHANNEL_ERROR'){
        console.warn('[Realtime] 재연결 시도...')
        setTimeout(setupRealtime,3000)
      }
    })
}

      ${selMode?`<div style="position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:50%;background:${sel?'var(--blue)':'rgba(255,255,255,.85)'};border:2px solid ${sel?'var(--blue)':'#ccc'};display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700">${sel?'✓':''}</div>`:''}
      ${!selMode?`<button onclick="event.stopPropagation();delFile('${f.id}','${siteId}','${siteName}')" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer">×</button>`:''}
    </div>`
  })
  html+='</div>'
  if(!files.length) html+='<div style="text-align:center;color:var(--text2);font-size:13px;padding:24px 0">아직 사진이 없어요</div>'
  if(selMode){
    html+=`<div style="position:sticky;bottom:0;background:#fff;padding:12px 0 4px;margin-top:12px;border-top:.5px solid var(--border)">
      <div style="display:flex;gap:8px;margin-bottom:8px">

function togglePhotoSel(siteId,siteName,idx,current){
  const sel=[...current]
  const i=sel.indexOf(idx)
  if(i>-1)sel.splice(i,1);else sel.push(idx)
  renderPhotos(siteId,siteName,true,sel)
}

function viewPhoto(idx,siteId,name){
  const f=(_sitePhotos[siteId]||[])[idx];if(!f)return
  openSheet(`<div class="st">${name||'사진'}</div>
    <img src="${f.file_data}" style="width:100%;border-radius:10px;margin-bottom:14px">

}

async function dlPhotos(siteId,selected){
  if(!selected.length){toast('사진을 선택하세요',true);return}
  const files=_sitePhotos[siteId]||[]
  toast(`${selected.length}장 다운로드 시작...`)
  for(let i=0;i<selected.length;i++){
    await new Promise(r=>setTimeout(r,400))
    const f=files[selected[i]]
    const a=document.createElement('a')
    a.href=f.file_data;a.download=f.file_name||`현장사진_${i+1}.jpg`
    document.body.appendChild(a);a.click();document.body.removeChild(a)
  }
  toast(`✅ ${selected.length}장 다운로드 완료`)
}

async function uploadPhotos(siteId,siteName,input){
  const files=Array.from(input.files);if(!files.length)return
  document.getElementById('up-prog').style.display='block'
  for(const file of files){
    const b64=await compressImg(file)
    await db.from('site_files').insert({site_id:siteId,file_name:file.name,file_data:b64,file_type:file.type})
  }
  toast(`${files.length}장 업로드 완료`)
  openSiteFiles(siteId,siteName)
}

function compressImg(file){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file)
    img.onload=()=>{
      const max=900,c=document.createElement('canvas')
      let w=img.width,h=img.height
      if(w>max){h=Math.round(h*max/w);w=max}
      if(h>max){w=Math.round(w*max/h);h=max}
      c.width=w;c.height=h
      c.getContext('2d').drawImage(img,0,0,w,h)
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.78))
    };img.src=url
  })
}

  await db.from('site_files').delete().eq('id',id)

}

function selectMatFromEl(el){

  const nameEl=document.getElementById('mat-sel-name')

let _drawingSiteId=null,_drawingSiteName=''

function drawingIcon(name){
  const ext=(name.split('.').pop()||'').toLowerCase()
  if(ext==='pdf')return '📄'
  if(['dwg','dxf','dgn','plt','dwf'].includes(ext))return '📐'
  if(['png','jpg','jpeg','tif','tiff'].includes(ext))return '🖼️'
  if(['doc','docx'].includes(ext))return '📝'
  if(['xls','xlsx'].includes(ext))return '📊'
  if(['zip','rar','7z'].includes(ext))return '🗜️'
  return '📎'
}

          </div>

          ${isPdf?`<button onclick="viewDrawingPdf('${f.id}')" style="flex:1;padding:9px;background:#EDE9FE;color:#5B21B6;border:.5px solid #C4B5FD;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer">👁 PDF 보기</button>`:''}
          <button onclick="delDrawing('${f.id}','${siteId}','${siteName}')" style="padding:9px 12px;background:none;border:.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text2);font-family:inherit;cursor:pointer">삭제</button>

async function uploadDrawing(siteId,siteName,input){
  const files=Array.from(input.files);if(!files.length)return
  const prog=document.getElementById('drw-prog')
  if(prog)prog.style.display='block'
  let ok=0
  for(const f of files){
    if(f.size>30*1024*1024){toast(`${f.name}: 30MB 이하 파일만 가능해요`,true);continue}
    const data=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f)})
    const{error}=await db.from('site_drawings').insert({site_id:siteId,file_name:f.name,file_data:data,file_type:f.type,uploaded_by:me.name})
    if(!error)ok++
  }
  input.value=''
  toast(ok?`${ok}개 업로드 완료`:'업로드 실패',!ok)
  openDrawings(siteId,siteName)
}

let _pdfDrawingData=null
function viewDrawingPdf(id){
  // 현재 렌더된 drawings에서 id로 찾기
  const sc=document.getElementById('sc')
  const a=sc.querySelector(`a[download]`)
  // openSheet로 iframe 표시
  const drawings=Array.from(sc.querySelectorAll('[data-drwid]'))
  // 대신 DB에서 직접 href 가져오기 - a태그 href 사용
  const allA=sc.querySelectorAll('a[download]')
  // 해당 버튼과 같은 행의 a태그를 찾는 방식 대신, 데이터 속성 활용
  // 이미 렌더된 HTML에서 직접 찾기 어려우므로 DB 재조회
  db.from('site_drawings').select('file_data,file_name').eq('id',id).single().then(({data})=>{
    if(!data)return
    const blob=new Blob([Uint8Array.from(atob(data.file_data.split(',')[1]),c=>c.charCodeAt(0))],{type:'application/pdf'})
    const url=URL.createObjectURL(blob)
    window.open(url,'_blank')
    setTimeout(()=>URL.revokeObjectURL(url),120000)
  })
}

async function delDrawing(id,siteId,siteName){

  await db.from('site_drawings').delete().eq('id',id)
  toast('삭제됐어요')

async function rSchedule(){
  document.getElementById('hdr-t').textContent='일정 관리'
  document.getElementById('hdr-s').textContent=`${scY}년 ${scMo+1}월`
  const mr=await db.from('members').select('*')
  members=mr.data||[]
  const from=`${scY}-${pad(scMo+1)}-01`
  const to=`${scY}-${pad(scMo+1)}-${new Date(scY,scMo+1,0).getDate()}`
  const{data:evts}=await db.from('cal_events').select('*').gte('work_date',from).lte('work_date',to).order('work_date')
  const{data:ems}=await db.from('cal_event_members').select('event_id,member:members(name)').order('event_id')
  const events=evts||[],emList=ems||[]
  const days=['일','월','화','수','목','금','토']
  const dim=new Date(scY,scMo+1,0).getDate()
  const fd=new Date(scY,scMo,1).getDay()
  const td=today()
  const byDate={}
  events.forEach(e=>{if(!byDate[e.work_date])byDate[e.work_date]=[];byDate[e.work_date].push(e)})

  let cal=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <button class="bs" onclick="scMo>0?scMo--:(scY--,scMo=11);rSchedule()">◀</button>
    <span style="font-size:15px;font-weight:600;color:var(--navy)">${scY}년 ${scMo+1}월</span>
    <button class="bs" onclick="scMo<11?scMo++:(scY++,scMo=0);rSchedule()">▶</button>
  </div>
  <div style="background:var(--white);border:.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px">
    <div style="display:grid;grid-template-columns:repeat(7,1fr);background:var(--navy)">
      ${days.map((d,i)=>`<div style="text-align:center;font-size:11px;font-weight:600;color:${i===0?'#FCA5A5':i===6?'#93C5FD':'rgba(255,255,255,.8)'};padding:8px 0">${d}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr)">`

  for(let i=0;i<fd;i++) cal+=`<div style="height:76px;background:#F8FAFC;border-right:.5px solid var(--border);border-bottom:.5px solid var(--border)"></div>`

  for(let i=0;i<dim;i++){
    const day=i+1,dstr=`${scY}-${pad(scMo+1)}-${pad(day)}`
    const isT=dstr===td,dow=new Date(scY,scMo,day).getDay()
    const last=(i+fd+1)%7===0,dayEvts=byDate[dstr]||[]
    cal+=`<div style="height:76px;overflow:hidden;padding:2px;border-right:${last?'none':'.5px solid var(--border)'};border-bottom:.5px solid var(--border);background:${isT?'#EEF4FF':'#fff'};cursor:pointer" onclick="openDateSheet('${dstr}')">
      <div style="width:20px;height:20px;border-radius:50%;background:${isT?'var(--blue)':'transparent'};color:${isT?'#fff':dow===0?'#EF4444':dow===6?'#3B82F6':'var(--text)'};display:flex;align-items:center;justify-content:center;margin:0 auto 2px;font-size:11px;font-weight:${isT?700:400}">${day}</div>`
    dayEvts.slice(0,3).forEach(e=>{
      cal+=`<div onclick="event.stopPropagation();openDateSheet('${dstr}')" style="background:${e.color||'#1A3A5C'};color:#fff;border-radius:2px;padding:1px 3px;font-size:9px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;line-height:1.4">${e.title}</div>`
    })
    if(dayEvts.length>3) cal+=`<div style="font-size:8px;color:var(--text2);padding-left:2px">+${dayEvts.length-3}개</div>`
    cal+=`</div>`
  }
  cal+=`</div></div>`

  document.getElementById('main').innerHTML=cal
}

function pickEvtCol(c){
  document.getElementById('ev-col').value=c
  document.querySelectorAll('#ev-cols div').forEach(d=>{d.style.border=d.dataset.c===c?'3px solid #333':'3px solid transparent'})
}

function togEvtM(id){
  const i=evtMems.indexOf(id),el=document.getElementById('em-'+id)
  if(i>-1){evtMems.splice(i,1);el.style.background='var(--white)';el.style.color='var(--text2)';el.style.borderColor='var(--border)'}
  else{evtMems.push(id);el.style.background='var(--navy)';el.style.color='#fff';el.style.borderColor='var(--navy)'}
}

async function saveEvt(){
  const title=document.getElementById('ev-title').value.trim()
  if(!title){toast('일정명을 입력하세요',true);return}
  const data={
    title,
    work_date:v('ev-s')||today(),
    end_date:v('ev-e')||v('ev-s')||today(),
    color:document.getElementById('ev-col').value,
    notes:v('ev-notes')
  }
  if(editId){
    await db.from('cal_events').update(data).eq('id',editId)
    await db.from('cal_event_members').delete().eq('event_id',editId)
    if(evtMems.length) await db.from('cal_event_members').insert(evtMems.map(mid=>({event_id:editId,member_id:mid})))
    toast('일정이 수정됐어요')
    editId=null
  }else{
    const{data:evt}=await db.from('cal_events').insert(data).select().single()
    if(evt&&evtMems.length) await db.from('cal_event_members').insert(evtMems.map(mid=>({event_id:evt.id,member_id:mid})))
    toast('일정 추가됐어요')
  }
  closeSheet();rSchedule()
}

// 날짜 시트 — 해당 날 일정 목록 + 추가 버튼
async function openDateSheet(date){
  const[,mo,d]=date.split('-')
  openSheet(`<div class="st">${mo}월 ${parseInt(d)}일</div><div class="loading"><div class="spin"></div></div>`)
  const{data:evts}=await db.from('cal_events').select('*').eq('work_date',date).order('created_at')
  const events=evts||[]
  // 팀원 이름 조회
  let emMap={}
  if(events.length){
    const ids=events.map(e=>e.id)
    const{data:ems}=await db.from('cal_event_members').select('event_id,member:members(name)').in('event_id',ids)
    ;(ems||[]).forEach(em=>{if(!emMap[em.event_id])emMap[em.event_id]=[];emMap[em.event_id].push(em.member?.name||'')})
  }
  let html=`<div class="st">${mo}월 ${parseInt(d)}일 일정</div>`
  if(events.length){
    events.forEach(e=>{
      const names=(emMap[e.id]||[]).filter(Boolean).join(', ')
      html+=`<div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:.5px solid var(--border)">
        <div style="width:10px;height:40px;border-radius:3px;background:${e.color||'#1A3A5C'};flex-shrink:0"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.title}</div>
          ${names?`<div style="font-size:12px;color:var(--text2);margin-top:2px">${names}</div>`:''}
          ${e.notes?`<div style="font-size:11px;color:var(--text2);margin-top:1px;opacity:.8">${e.notes}</div>`:''}
        </div>
        ${me.isAdmin?`<div style="display:flex;gap:6px;flex-shrink:0">
          <button onclick="openEvtEdit('${e.id}')" style="background:var(--bg);border:.5px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--navy);font-family:inherit;font-weight:500">수정</button>
          <button onclick="confirmDelEvt('${e.id}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:20px;padding:2px;line-height:1">×</button>
        </div>`:''}
      </div>`
    })
  }else{
    html+=`<div style="text-align:center;padding:24px 0;color:var(--text2);font-size:13px">이 날 등록된 일정이 없어요</div>`
  }
  if(me.isAdmin){
    html+=`<button class="btn bp" style="margin-top:16px" onclick="openEvtAdd('${date}')">+ 일정 추가하기</button>`
  }
  document.getElementById('sc').innerHTML=html
}

  editId=id

    <div class="fr">
      <div class="fg"><label class="fl">시작일</label><input class="fi" id="ev-s" type="date" value="${e.work_date}"></div>
      <div class="fg"><label class="fl">종료일</label><input class="fi" id="ev-e" type="date" value="${e.end_date||e.work_date}"></div>
    </div>
    <div class="fg"><label class="fl">색상</label><div id="ev-cols" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${cHtml}</div><input type="hidden" id="ev-col" value="${e.color||ECOLS[0]}"></div>
    <div class="fg"><label class="fl">참여 팀원</label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${mHtml}</div></div>

let catAddOpen=false,catEditId=null

async function openCatalogMgr(){
  const{data}=await db.from('catalog_items').select('*').order('sort_order').order('created_at')
  catalogItems=data||[]
  catMgrTab=CATS[0];catAddOpen=false
  document.getElementById('cat-tabs').innerHTML=CATS.map(c=>`<button class="qo-tab${c===catMgrTab?' on':''}" onclick="setCatMgrTab('${c}')">${c}</button>`).join('')
  renderCatMgr()
  document.getElementById('catoverlay').classList.add('on')
}
function closeCatalogMgr(){document.getElementById('catoverlay').classList.remove('on');catAddOpen=false}
function setCatMgrTab(c){catMgrTab=c;catAddOpen=false;document.querySelectorAll('#cat-tabs .qo-tab').forEach(b=>b.classList.toggle('on',b.textContent===c));renderCatMgr()}

function renderCatMgr(){
  const items=catalogItems.filter(i=>i.cat===catMgrTab)
  const inlineForm=(id,i)=>`
    <div style="background:#EEF4FB;border:.5px solid var(--navy);border-radius:12px;padding:14px;margin-bottom:7px">
      <div style="font-size:12px;font-weight:600;color:var(--navy);margin-bottom:10px">${id?'✏️ 품목 수정':'+ 품목 추가'} · ${catMgrTab}</div>
      <div class="fg"><label class="fl">품명 *</label><input class="fi" id="ci-name" value="${i?.name||''}" placeholder="예) HIV 2.5sq" style="background:#fff"></div>
      <div class="fr">
        <div class="fg"><label class="fl">규격</label><input class="fi" id="ci-spec" value="${i?.spec||''}" placeholder="예) 100m/R" style="background:#fff"></div>
        <div class="fg"><label class="fl">단위</label><input class="fi" id="ci-unit" value="${i?.unit||''}" placeholder="롤, 개, m" style="background:#fff"></div>
      </div>
      <div class="fg"><label class="fl">단가 (원) *</label><input class="fi" type="number" id="ci-price" value="${i?.price||''}" placeholder="0" min="0" style="background:#fff"></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button onclick="${id?`updateCatItem('${id}')`:'saveCatItem()'}" style="flex:1;padding:11px;border-radius:8px;background:var(--navy);color:#fff;border:none;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap">${id?'수정 완료':'저장'}</button>
        <button onclick="catAddOpen=false;catEditId=null;renderCatMgr()" style="padding:11px 16px;border-radius:8px;border:.5px solid var(--border);background:#fff;color:var(--text2);font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap">취소</button>
      </div>
    </div>`
  const listHtml=items.length
    ?items.map(i=>catEditId===i.id ? inlineForm(i.id,i) : `
      <div class="cm-item">
        <div class="cm-meta">
          <div class="cm-name">${i.name}</div>
          <div class="cm-sub">${[i.spec,i.unit].filter(Boolean).join(' · ')}</div>
        </div>
        <div class="cm-price">${(i.price||0).toLocaleString()}원</div>
        <button class="cm-edit" onclick="catEditId='${i.id}';catAddOpen=false;renderCatMgr()">✏️</button>
        <button class="cm-del" onclick="deleteCatItem('${i.id}')">×</button>
      </div>`).join('')
    :`<div class="empty" style="padding:32px 20px"><div class="ei">📦</div><div style="font-size:13px">품목이 없어요</div><div style="font-size:12px;margin-top:4px">아래 버튼으로 추가하세요</div></div>`
  const addFormHtml=catAddOpen ? inlineForm(null,null) : ''
  document.getElementById('cat-body').innerHTML=listHtml+addFormHtml
  if(catAddOpen||catEditId)setTimeout(()=>document.getElementById('ci-name')?.focus(),50)
  document.getElementById('cat-add-btn').textContent=(catAddOpen||catEditId)?'▲ 닫기':'+ 품목 추가'
}

function showAddCatItemSheet(){catAddOpen=!catAddOpen;catEditId=null;renderCatMgr()}

async function saveCatItem(){
  const name=document.getElementById('ci-name')?.value.trim()
  const price=parseInt(document.getElementById('ci-price')?.value||0)
  if(!name){toast('품명을 입력하세요',true);return}
  if(!price){toast('단가를 입력하세요',true);return}
  const{data,error}=await db.from('catalog_items').insert({
    cat:catMgrTab,name,
    spec:document.getElementById('ci-spec')?.value.trim()||'',
    unit:document.getElementById('ci-unit')?.value.trim()||'',
    price,sort_order:catalogItems.filter(i=>i.cat===catMgrTab).length
  }).select().single()
  if(error){toast('저장 실패: '+error.message,true);return}
  catalogItems.push(data)
  catAddOpen=false
  toast('추가됐어요');renderCatMgr()
}

async function updateCatItem(id){
  const name=document.getElementById('ci-name')?.value.trim()
  const price=parseInt(document.getElementById('ci-price')?.value||0)
  if(!name){toast('품명을 입력하세요',true);return}
  if(!price){toast('단가를 입력하세요',true);return}
  const updates={name,spec:document.getElementById('ci-spec')?.value.trim()||'',unit:document.getElementById('ci-unit')?.value.trim()||'',price}
  const{error}=await db.from('catalog_items').update(updates).eq('id',id)
  if(error){toast('수정 실패: '+error.message,true);return}
  catalogItems=catalogItems.map(i=>i.id===id?{...i,...updates}:i)
  catEditId=null
  toast('수정됐어요');renderCatMgr()
}

async function deleteCatItem(id){
  if(!confirm('이 품목을 삭제할까요?'))return
  await db.from('catalog_items').delete().eq('id',id)
  catalogItems=catalogItems.filter(i=>i.id!==id)
  toast('삭제됐어요');renderCatMgr()
}

async function showQuoteForm(){
  const{data}=await db.from('catalog_items').select('*').order('sort_order').order('created_at')
  catalogItems=data||[]
  qQtys={};qCatTab=CATS[0]
  document.getElementById('qo-site-name').value=''
  document.getElementById('qo-client').value=''
  document.getElementById('qo-notes').value=''
  document.getElementById('qs-tool-rate').value=3
  document.getElementById('qs-margin-rate').value=8
  document.getElementById('qo-tabs').innerHTML=CATS.map(c=>`<button class="qo-tab${c===qCatTab?' on':''}" onclick="setQCat('${c}')">${c}</button>`).join('')
  renderQBody();calcQ()
  document.getElementById('qoverlay').classList.add('on')
}
function closeQOverlay(){document.getElementById('qoverlay').classList.remove('on');_qEditId=null;document.querySelector('#qoverlay h2').textContent='견적서 작성'}
function setQCat(c){qCatTab=c;document.querySelectorAll('#qo-tabs .qo-tab').forEach(b=>b.classList.toggle('on',b.textContent===c));renderQBody()}

function renderQBody(){
  const items=catalogItems.filter(i=>i.cat===qCatTab)
  if(!items.length){
    document.getElementById('qo-body').innerHTML=`<div class="empty" style="padding:32px 20px"><div class="ei">📦</div><div style="font-size:13px">이 카테고리에 품목이 없어요</div><div style="font-size:12px;margin-top:4px">관리자가 카탈로그에서 먼저 등록해야 해요</div></div>`
    return
  }
  document.getElementById('qo-body').innerHTML=items.map(item=>{
    const qty=qQtys[item.id]||0,sub=(item.price||0)*qty
    return `<div class="qc-item${qty>0?' active':''}" id="qc-${item.id}">
      <div class="qc-meta">
        <div class="qc-name">${item.name}</div>
        <div class="qc-sub">${[item.spec,item.unit].filter(Boolean).join(' · ')}</div>
      </div>
      <div class="qc-right">
        <div class="qc-price">${(item.price||0).toLocaleString()}원/${item.unit||'개'}</div>
        <div class="qc-qty-wrap">
          <button onclick="adjQty('${item.id}',-1)">−</button>
          <input type="number" min="0" value="${qty||''}" placeholder="0"
            onchange="setQtyVal('${item.id}',this.value)" oninput="setQtyVal('${item.id}',this.value)"
            style="width:42px;height:26px;border:.5px solid var(--border);border-radius:6px;font-size:13px;text-align:center;font-family:inherit;outline:none">
          <button onclick="adjQty('${item.id}',1)">+</button>
        </div>
        ${qty>0?`<div class="qc-subtotal">${sub.toLocaleString()}원</div>`:''}
      </div>
    </div>`
  }).join('')
}

function adjQty(id,d){qQtys[id]=Math.max(0,(qQtys[id]||0)+d);renderQBody();calcQ()}
function setQtyVal(id,v){qQtys[id]=Math.max(0,parseInt(v)||0);const el=document.getElementById('qc-'+id);if(el)el.className='qc-item'+(qQtys[id]>0?' active':'');calcQ()}

function calcQ(){
  let mat=0
  catalogItems.forEach(i=>{mat+=(i.price||0)*(qQtys[i.id]||0)})
  const toolRate=parseFloat(document.getElementById('qs-tool-rate')?.value||0)
  const mgRate=parseFloat(document.getElementById('qs-margin-rate')?.value||0)
  const tool=Math.round(mat*toolRate/100),mg=Math.round(mat*mgRate/100)
  const supply=mat+tool+mg,vat=Math.round(supply*.1),grand=supply+vat
  document.getElementById('qs-mat').textContent=mat.toLocaleString()+'원'
  document.getElementById('qs-tool').textContent=tool.toLocaleString()+'원'
  document.getElementById('qs-margin').textContent=mg.toLocaleString()+'원'
  document.getElementById('qs-supply').textContent=supply.toLocaleString()+'원'
  document.getElementById('qs-vat').textContent=vat.toLocaleString()+'원'
  document.getElementById('qs-grand').textContent=grand.toLocaleString()+'원'
}

async function saveQFromCatalog(){
  const allItems=[];let mat=0
  catalogItems.forEach(i=>{const qty=qQtys[i.id]||0;if(qty>0){const total=(i.price||0)*qty;allItems.push({cat:i.cat,name:i.name,spec:i.spec||'',unit:i.unit||'',qty,price:i.price||0,total});mat+=total}})
  if(!allItems.length){toast('수량을 입력한 품목이 없어요',true);return}
  const toolRate=parseFloat(document.getElementById('qs-tool-rate').value||0)
  const mgRate=parseFloat(document.getElementById('qs-margin-rate').value||0)
  const tool=Math.round(mat*toolRate/100),mg=Math.round(mat*mgRate/100)
  const supply=mat+tool+mg,vat=Math.round(supply*.1),grand=supply+vat
  const payload={
    site_name:document.getElementById('qo-site-name').value.trim(),
    client:document.getElementById('qo-client').value.trim(),
    notes:document.getElementById('qo-notes').value.trim()||null,
    items:allItems,mat,tool_rate:toolRate,tool_cost:tool,
    margin_rate:mgRate,margin_cost:mg,supply,vat,grand,
    total:grand
  }
  let error
  if(_qEditId){
    ({error}=await db.from('quotes').update(payload).eq('id',_qEditId))
  } else {
    payload.status='작성중'
    ;({error}=await db.from('quotes').insert(payload))
  }
  if(error){toast('저장 실패: '+error.message,true);return}
  toast(_qEditId?'견적서 수정됐어요':'견적서 저장됐어요');closeQOverlay();rQuotes()
}

async function editQ(id){
  const q=quotes.find(x=>x.id===id);if(!q)return
  const{data}=await db.from('catalog_items').select('*').order('sort_order').order('created_at')
  catalogItems=data||[]
  _qEditId=id;qCatTab=CATS[0];qQtys={}
  // 저장된 품목을 카탈로그 ID로 매핑
  const savedItems=q.items||[]
  savedItems.forEach(saved=>{
    const match=catalogItems.find(c=>c.name===saved.name&&c.cat===saved.cat)
    if(match)qQtys[match.id]=saved.qty
  })
  document.getElementById('qo-site-name').value=q.site_name||''
  document.getElementById('qo-client').value=q.client||''
  document.getElementById('qo-notes').value=q.notes||''
  document.getElementById('qs-tool-rate').value=q.tool_rate??3
  document.getElementById('qs-margin-rate').value=q.margin_rate??8
  document.getElementById('qo-tabs').innerHTML=CATS.map(c=>`<button class="qo-tab${c===qCatTab?' on':''}" onclick="setQCat('${c}')">${c}</button>`).join('')
  renderQBody();calcQ()
  document.querySelector('#qoverlay h2').textContent='견적서 수정'
  document.getElementById('qoverlay').classList.add('on')
  closeSheet()
}

async function updQS(id,status){await db.from('quotes').update({status}).eq('id',id);quotes=quotes.map(q=>q.id===id?{...q,status}:q);toast('상태 변경됐어요')}
async function delQ(id){if(!confirm('삭제할까요?'))return;await db.from('quotes').delete().eq('id',id);toast('삭제됐어요');closeSheet();rQuotes()}

    ${ytId?`<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">▶ 유튜브 영상</div><div style="position:relative;padding-bottom:56.25%;height:0;border-radius:10px;overflow:hidden"><iframe src="https://www.youtube.com/embed/${ytId}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none" allowfullscreen></iframe></div></div>`:''}
    ${p.video_data?`<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">🎬 ${p.video_name||'동영상'}</div><video controls style="width:100%;border-radius:10px;background:#000" src="${p.video_data}"></video></div>`:''}
    ${p.files&&p.files.length?`<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">📎 첨부파일 (${p.files.length}개)</div>${p.files.map(f=>`<a href="${f.data}" download="${f.name}" style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px;text-decoration:none;color:var(--navy)"><span style="font-size:18px">${fileIcon(f.name)}</span><span style="font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span><span style="font-size:11px;color:var(--blue);font-weight:600;flex-shrink:0">다운로드</span></a>`).join('')}</div>`:''}
    ${me?.isAdmin?`<div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn bp" onclick="showEduForm('${p.id}')" style="flex:1">수정</button>
      <button class="btn bg-r" onclick="delEduPost('${p.id}')" style="flex:1;border:.5px solid var(--border)">삭제</button>
    </div>`:''}
  `)
}

function fileIcon(name){
  const ext=(name.split('.').pop()||'').toLowerCase()
  if(['pdf'].includes(ext))return '📄'
  if(['doc','docx'].includes(ext))return '📝'
  if(['xls','xlsx'].includes(ext))return '📊'
  if(['ppt','pptx'].includes(ext))return '📑'
  if(['html','htm'].includes(ext))return '🌐'
  if(['txt'].includes(ext))return '📃'
  if(['zip','rar','7z'].includes(ext))return '🗜️'
  return '📎'
}

function showImgLightbox(src){
  const lb=document.getElementById('img-lightbox')
  document.getElementById('img-lightbox-img').src=src
  lb.style.display='flex'
}

function extractYtId(url){
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/)
  return m?m[1]:null
}

function showEduForm(editId=null){
  _eduEditId=editId
  const p=editId?eduPosts.find(x=>x.id===editId):null
  document.getElementById('edu-overlay').classList.add('on')
  document.getElementById('edu-title').value=p?.title||''
  document.getElementById('edu-content').value=p?.content||''
  document.getElementById('edu-yt').value=p?.youtube_url||''
  window._eduImages=p?.images?[...p.images]:[]
  window._eduVideo=p?.video_data||null
  window._eduVideoName=p?.video_name||''
  window._eduFiles=p?.files?[...p.files]:[]
  renderEduImages()
  renderEduFiles()
  document.getElementById('edu-video-label').textContent=p?.video_data?`✅ ${p.video_name||'동영상 첨부됨'}`:'동영상 없음'
}

function closeEduOverlay(){
  document.getElementById('edu-overlay').classList.remove('on')
  _eduEditId=null;window._eduImages=[];window._eduVideo=null;window._eduVideoName='';window._eduFiles=[]
}

function renderEduImages(){
  const grid=document.getElementById('edu-img-grid')
  if(!grid)return
  grid.innerHTML=(window._eduImages||[]).map((img,i)=>`
    <div style="position:relative">
      <img src="${img}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px">
      <button onclick="removeEduImg(${i})" style="position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1">×</button>
    </div>`).join('')
}

function removeEduImg(i){window._eduImages.splice(i,1);renderEduImages()}

function eduImgUpload(input){
  const files=Array.from(input.files)
  files.forEach(f=>{
    if(f.size>5*1024*1024){toast('사진은 5MB 이하만 가능해요',true);return}
    const r=new FileReader()
    r.onload=e=>{window._eduImages.push(e.target.result);renderEduImages()}
    r.readAsDataURL(f)
  })
  input.value=''
}

function eduVideoUpload(input){
  const f=input.files[0];if(!f)return
  if(f.size>50*1024*1024){toast('동영상은 50MB 이하만 가능해요',true);return}
  const r=new FileReader()
  r.onload=e=>{
    window._eduVideo=e.target.result;window._eduVideoName=f.name
    document.getElementById('edu-video-label').textContent=`✅ ${f.name}`
    toast('동영상 첨부됐어요')
  }
  r.readAsDataURL(f)
  input.value=''
}

function eduFileUpload(input){
  const files=Array.from(input.files)
  files.forEach(f=>{
    if(f.size>10*1024*1024){toast(`${f.name}: 10MB 이하 파일만 가능해요`,true);return}
    const r=new FileReader()
    r.onload=e=>{
      window._eduFiles.push({name:f.name,data:e.target.result,type:f.type})
      renderEduFiles()
      toast(`${f.name} 첨부됐어요`)
    }
    r.readAsDataURL(f)
  })
  input.value=''
}

function removeEduFile(i){window._eduFiles.splice(i,1);renderEduFiles()}

function renderEduFiles(){
  const list=document.getElementById('edu-file-list')
  if(!list)return
  const files=window._eduFiles||[]
  list.innerHTML=files.map((f,i)=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:5px">
      <span style="font-size:13px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📎 ${f.name}</span>
      <button onclick="removeEduFile(${i})" style="background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;flex-shrink:0;padding:0 0 0 8px">×</button>
    </div>`).join('')
}

async function saveEduPost(){
  const title=document.getElementById('edu-title')?.value.trim()
  const content=document.getElementById('edu-content')?.value.trim()
  const youtube_url=document.getElementById('edu-yt')?.value.trim()
  if(!title){toast('제목을 입력하세요',true);return}
  const payload={title,content,youtube_url:youtube_url||null,images:window._eduImages||[],video_data:window._eduVideo||null,video_name:window._eduVideoName||null,files:window._eduFiles||[],author_name:me.name}
  let error
  if(_eduEditId){
    ({error}=await db.from('edu_posts').update(payload).eq('id',_eduEditId))
  } else {
    ({error}=await db.from('edu_posts').insert(payload))
  }
  if(error){toast('저장 실패: '+error.message,true);return}
  toast(_eduEditId?'수정됐어요':'게시글이 등록됐어요')
  closeEduOverlay();closeSheet();rEdu()
}

async function delEduPost(id){
  if(!confirm('게시글을 삭제할까요?'))return
  await db.from('edu_posts').delete().eq('id',id)
  toast('삭제됐어요');closeSheet();rEdu()
}

// ══════════════ 팀원 + 근태 ══════════════
async function rTeam(){
  document.getElementById('hdr-t').textContent='팀원 관리'
  const{data}=await db.from('members').select('*').order('created_at')
  members=data||[]
  document.getElementById('hdr-s').textContent=me.isAdmin?`총 ${members.length}명`:`${me.name}님의 근태`

  if(me.isAdmin){
    // 관리자: 이달 근태 현황 + 팀원 목록
    const now=new Date(),y=now.getFullYear(),mo=now.getMonth()
    const from=`${y}-${pad(mo+1)}-01`,to=`${y}-${pad(mo+1)}-${new Date(y,mo+1,0).getDate()}`
    const{data:att}=await db.from('attendance').select('*').gte('work_date',from).lte('work_date',to)
    const attData=att||[]
    const wdays=new Date(y,mo+1,0).getDate()

    document.getElementById('main').innerHTML=`
      <div style="background:#FEF3C7;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#92400E">🔐 관리자 전용 — 팀원 근태는 관리자만 볼 수 있어요</div>
      <div class="sec-hdr"><div class="sec-t">${now.getMonth()+1}월 근태 현황 (탭하면 상세보기)</div></div>
      <div class="card" style="padding:10px 14px;margin-bottom:14px">
        ${members.length?members.map((m,i)=>{
          const myAtt=attData.filter(a=>a.member_id===m.id)
          const worked=myAtt.length,ot=myAtt.filter(a=>a.overtime).length
          const[bg,fg]=COLORS[i%COLORS.length].split(':')
          return `<div class="mem-att-row" onclick="openAdminAtt('${m.id}','${m.name.replace(/'/g,'')}')">
            <div class="av" style="background:${bg};color:${fg};width:34px;height:34px;font-size:12px">${m.name[0]}</div>
            <div style="flex:1">
              <div style="display:flex;justify-content:space-between;margin-bottom:5px">
                <span style="font-size:13px;font-weight:600">${m.name}</span>
                <span style="font-size:11px;color:var(--text2)">${worked}일 출근 · 야근 ${ot}회</span>
              </div>
              <div class="att-bar-wrap"><div class="att-bar-fill" style="width:${Math.min(Math.round(worked/wdays*100),100)}%"></div></div>
            </div>
            <span style="font-size:14px;color:var(--text2);margin-left:6px">›</span>
          </div>`
        }).join(''):`<div style="text-align:center;color:var(--text2);padding:16px;font-size:13px">팀원을 추가하세요</div>`}
      </div>
      <div class="sec-hdr"><div class="sec-t">팀원 목록</div></div>
      ${members.map((m,i)=>{
        const[bg,fg]=COLORS[i%COLORS.length].split(':')
        return `<div class="li"><div style="display:flex;align-items:center;gap:12px">
          <div class="av" style="background:${bg};color:${fg}">${m.name[0]}</div>
          <div style="flex:1"><div style="font-size:15px;font-weight:600">${m.name}</div><div style="font-size:12px;color:var(--text2)">${m.role||'내선전공'}${m.phone?' · '+m.phone:''}</div></div>
          ${m.phone?`<a href="tel:${m.phone}" style="font-size:22px;text-decoration:none">📞</a>`:''}
        </div><div class="la">
          <button class="bs" onclick="editMem('${m.id}')">✏️ 수정</button>
          <button class="bs" style="color:var(--red)" onclick="delMem('${m.id}')">삭제</button>
        </div></div>`
      }).join('')||`<div class="empty"><div class="ei">👷</div><div style="font-size:14px">팀원이 없어요</div></div>`}
    `
  } else {
    // 일반 팀원: 본인 근태 캘린더
    await renderMyAttendance()
  }
}

// 팀원 본인 근태
async function renderMyAttendance(){
  const from=`${attY}-${pad(attMo+1)}-01`,to=`${attY}-${pad(attMo+1)}-${new Date(attY,attMo+1,0).getDate()}`
  const{data}=await db.from('attendance').select('*').eq('member_id',me.id).gte('work_date',from).lte('work_date',to)
  const att=data||[]
  document.getElementById('main').innerHTML=`
    <div style="background:#E8F0F8;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--navy)">
      📅 날짜를 탭해서 출근 체크하세요 &nbsp;·&nbsp; 한 번 더 탭하면 야근, 다시 탭하면 취소
    </div>
    ${buildAttCalendar(att,attY,attMo,true)}
  `
}

// 관리자: 팀원 근태 상세
async function openAdminAtt(memberId,memberName){
  adminAttMemberId=memberId;adminAttMemberName=memberName
  const y=attY,mo=attMo
  const from=`${y}-${pad(mo+1)}-01`,to=`${y}-${pad(mo+1)}-${new Date(y,mo+1,0).getDate()}`
  const{data}=await db.from('attendance').select('*').eq('member_id',memberId).gte('work_date',from).lte('work_date',to)
  const att=data||[]
  openSheet(`<div class="st">${memberName} 근태 상세</div>${buildAttCalendar(att,y,mo,false,memberId)}`)
}

function buildAttCalendar(att,y,mo,editable,memberId=null){
  const dim=new Date(y,mo+1,0).getDate()
  const firstDay=new Date(y,mo,1).getDay()
  const days=['일','월','화','수','목','금','토']
  const td=today()
  const worked=att.length,ot=att.filter(a=>a.overtime).length
  const navFn=editable
    ?`(d)=>{attY=d.y;attMo=d.mo;renderMyAttendance()}`
    :`(d)=>{attY=d.y;attMo=d.mo;openAdminAtt('${memberId||adminAttMemberId}','${adminAttMemberName}')}`

  return `<div class="att-wrap">
    <div class="att-month-nav">
      <button class="bs" style="padding:6px 10px" onclick="(${navFn})({y:${mo===0?y-1:y},mo:${mo===0?11:mo-1}})">◀</button>
      <div class="att-month-title">${y}년 ${mo+1}월</div>
      <button class="bs" style="padding:6px 10px" onclick="(${navFn})({y:${mo===11?y+1:y},mo:${mo===11?0:mo+1}})">▶</button>
    </div>
    <div class="att-summary">
      <div class="att-sum"><div class="att-sum-n">${worked}</div><div class="att-sum-l">출근일</div></div>
      <div class="att-sum"><div class="att-sum-n">${ot}</div><div class="att-sum-l">야근</div></div>
      <div class="att-sum"><div class="att-sum-n">${dim-worked}</div><div class="att-sum-l">미출근</div></div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:10px;font-size:11px;color:var(--text2)">
      <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:2px;background:var(--navy)"></div>출근</div>
      <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:2px;background:var(--blue)"></div>출근+야근</div>
    </div>
    <div class="att-grid">
      ${days.map(d=>`<div class="att-dh">${d}</div>`).join('')}
      ${Array(firstDay).fill('<div class="att-day blank"></div>').join('')}
      ${Array.from({length:dim},(_,i)=>{
        const day=i+1,dateStr=`${y}-${pad(mo+1)}-${pad(day)}`
        const rec=att.find(a=>a.work_date===dateStr)
        const isFuture=dateStr>td,isToday=dateStr===td
        const cls=[isFuture?'future':rec?.overtime?'overtime':rec?'worked':'',isToday?'istoday':''].join(' ').trim()
        const clickFn=editable&&!isFuture?`onclick="toggleAtt('${dateStr}')"`:`onclick=""`
        return `<div class="att-day ${cls}" ${clickFn}><span>${day}</span>${rec?.overtime?'<span class="att-ot-dot">야근</span>':''}</div>`
      }).join('')}
    </div>
  </div>`
}

async function toggleAtt(date){
  const{data,error}=await db.from('attendance').select('*').eq('member_id',me.id).eq('work_date',date)
  const rec=data?.[0]
  if(!rec){
    await db.from('attendance').insert({member_id:me.id,work_date:date,overtime:false})
    toast('✅ 출근 체크')
  }else if(!rec.overtime){
    await db.from('attendance').update({overtime:true}).eq('id',rec.id)
    toast('🌙 야근 체크')
  }else{
    await db.from('attendance').delete().eq('id',rec.id)
    toast('출근 취소')
  }
  await renderMyAttendance()
}

// 팀원 CRUD
function showMemberForm(m=null){
  editId=m?.id||null
  openSheet(`<div class="st">${m?'팀원 수정':'팀원 추가'}</div>
    <div class="fg"><label class="fl">이름 *</label><input class="fi" id="f-mn" placeholder="예) 김철수" value="${m?.name||''}"></div>
    <div class="fg"><label class="fl">직급</label><select class="fi" id="f-mr" style="background:#fff">${['대표','팀장','대리','주임'].map(r=>`<option ${(m?.role||'주임')===r?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">연락처</label><input class="fi" id="f-mp" type="tel" placeholder="010-0000-0000" value="${m?.phone||''}"></div>
    <div class="fg">
      <label class="fl">${m?'비밀번호 변경 (비워두면 유지)':'초기 비밀번호 설정'}</label>
      <input class="fi" type="password" id="f-mpw" placeholder="${m?'새 비밀번호 (선택)':'비밀번호 입력'}">
    </div>
    ${m&&m.password!==undefined?`<div style="background:#FEF3C7;border-radius:8px;padding:8px 12px;font-size:12px;color:#92400E;margin-bottom:12px">🔑 현재 비밀번호: ${m.password?'설정됨':'미설정'}</div>`:''}
    <button class="btn bp" onclick="saveMem()">${m?'저장':'추가'}</button>
    ${m?`
      <button class="btn" style="background:#F1F5F9;color:var(--red);margin-top:8px" onclick="resetMemberPw('${m.id}','${m.name}')">🔑 비밀번호 초기화</button>
      <button class="btn bg-r" onclick="delMem('${m.id}')">팀원 삭제</button>`:''}
  `)
}
async function resetMemberPw(id,name){
  if(!confirm(`${name}님의 비밀번호를 초기화할까요?\n다음 로그인 시 새 비밀번호를 설정하게 됩니다.`))return
  await db.from('members').update({password:''}).eq('id',id)
  toast(`${name}님 비밀번호 초기화 완료`)
  closeSheet()
}
async function editMem(id){
  const{data}=await db.from('members').select('*').eq('id',id).single()
  if(data) showMemberForm(data)
}
async function saveMem(){
  const name=document.getElementById('f-mn').value.trim()
  if(!name){toast('이름을 입력하세요',true);return}
  const pw=document.getElementById('f-mpw')?.value||''
  const data={name,role:v('f-mr'),phone:v('f-mp')}
  if(pw) data.password=pw
  if(!editId) data.password=pw||''
  if(editId){await db.from('members').update(data).eq('id',editId);toast('수정됐어요')}
  else{await db.from('members').insert(data);toast('추가됐어요')}
  closeSheet();rTeam()
}
async function delMem(id){
  if(!confirm('이 팀원을 삭제할까요?'))return
  await db.from('members').delete().eq('id',id);toast('삭제했어요');closeSheet();rTeam()
}
</script>
